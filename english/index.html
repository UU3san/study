<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>英単語 一問一答 暗記カード</title>
<style>
:root {
  --bg:#f4f6fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;
  --blue:#2563eb;--blueSoft:#eaf2ff;--red:#c62828;--redSoft:#feecec;
  --green:#087a55;--greenSoft:#e7f8f0;--shadow:0 10px 28px rgba(24,39,75,.09)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 32px}
h1{font-size:1.28rem;margin:4px 0 12px}
.sectionTitle,label{font-size:12px;color:var(--muted);display:block;margin:4px 0 5px}
.grid{display:grid;gap:9px}
.userbar{grid-template-columns:1fr auto auto;margin-bottom:11px}
.filters{grid-template-columns:1fr 1fr 1fr;margin-bottom:9px}
.tools{grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.freqbar{grid-template-columns:1fr 1fr;margin-bottom:10px}
select,button{min-height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-size:15px;padding:9px 11px}
button{cursor:pointer;font-weight:650} button:active{transform:translateY(1px)}
.primary{background:var(--blueSoft);border-color:#a9c8ff} .danger{background:var(--redSoft);border-color:#f4b7b7;color:#941b1b}
.success{background:var(--greenSoft);border-color:#a9ddca;color:#075f43} .active{outline:3px solid rgba(37,99,235,.15);border-color:#7caafc}
.status{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 11px} .chip{font-size:13px;background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.card{width:100%;text-align:left;min-height:285px;background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);padding:20px 18px}
.meta,.small{font-size:13px;color:var(--muted)} .side{font-size:13px;color:var(--muted);margin:10px 0 7px}
.question{font-size:1.65rem;line-height:1.65;font-weight:750;word-break:break-word}
.answer{font-size:1.6rem;line-height:1.65;font-weight:800;color:var(--red);margin:8px 0 4px}
.noteBox{background:#fff8e8;border:1px solid #efd595;border-radius:12px;padding:9px 10px;margin-top:11px;font-size:12px;line-height:1.55;color:#6f5314}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.actions,.nav,.lookup{display:grid;gap:9px;margin-top:10px} .actions{grid-template-columns:1fr 1fr} .lookup{grid-template-columns:repeat(3,1fr)} .nav{grid-template-columns:repeat(4,1fr)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:25px 16px;text-align:center;color:var(--muted);line-height:1.7}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr 1fr}.lookup{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.question{font-size:1.45rem}}

.homeLink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);text-decoration:none;font-size:13px;font-weight:650}
.homeLink:active{transform:translateY(1px)}

</style>
</head>
<body>
<div class="wrap">
<a class="homeLink" href="../">← ホームへ戻る</a>
<h1>高校入試 英単語 一問一答</h1>

<div class="sectionTitle">学習するユーザー</div>
<div class="grid userbar">
  <select id="userSelect"></select><button id="addUser">＋追加</button><button id="deleteUser">削除</button>
</div>

<div class="grid filters">
  <div><label>出題方向</label><select id="direction">
    <option value="ej">英語 → 日本語</option>
    <option value="je">日本語 → 英語</option>
    <option value="both">両方向</option>
  </select></div>
  <div><label>セット</label><select id="setSel">
    <option value="all">全13セット</option>
    <option value="1">セット1</option><option value="2">セット2</option><option value="3">セット3</option><option value="4">セット4</option><option value="5">セット5</option><option value="6">セット6</option><option value="7">セット7</option><option value="8">セット8</option><option value="9">セット9</option><option value="10">セット10</option><option value="11">セット11</option><option value="12">セット12</option><option value="13">セット13</option>
  </select></div>
  <div><label>復習</label><button id="weakOnly" class="primary" style="width:100%">覚えていないだけ：OFF</button></div>
</div>

<div class="grid tools">
  <button id="shuffle">シャッフル</button>
  <button id="resetOrder">元の順番</button>
  <button id="clearWeak">要復習を消す</button>
  <button id="clearAll">このユーザーをリセット</button>
</div>

<div class="grid freqbar">
  <select id="freqMin">
    <option value="0">苦手頻度：通常</option>
    <option value="2">2回以上ミスだけ</option>
    <option value="3">3回以上ミスだけ</option>
    <option value="5">5回以上ミスだけ</option>
    <option value="10">10回以上ミスだけ</option>
  </select>
  <button id="showStats">📊 苦手集計を見る</button>
</div>

<div class="status">
  <span class="chip" id="progress">0 / 0</span>
  <span class="chip" id="weakCount">覚えていない 0</span>
  <span class="chip" id="learnedCount">覚えた 0</span>
  <span class="chip" id="freqCount">2回以上ミス 0</span>
</div>

<div id="statsPanel" style="display:none;margin-bottom:11px;"></div>
<div id="main"></div>

<div class="note">
カードをタッチすると答えが出ます。「覚えていない」を押した回数も問題ごとに記録し、
2回以上・3回以上など、苦手頻度が高い問題だけを復習できます。
英語は「🔊 発音」で端末の英語音声を使って読み上げます。
</div>
</div>

<script>
const WORDS=[{"set":1,"en":"monument","ja":"記念碑","id":"v001"},{"set":1,"en":"atomic bomb","ja":"原子爆弾","id":"v002"},{"set":1,"en":"dome","ja":"ドーム","id":"v003"},{"set":1,"en":"remind","ja":"～に思い出させる","source_note":"元画像の意味欄は「～に思い出させるもの」でした。学習用には動詞の意味に直しています。","id":"v004"},{"set":1,"en":"reminder","ja":"思い出させるもの","id":"v005"},{"set":1,"en":"mission","ja":"任務、使命","id":"v006"},{"set":1,"en":"peace","ja":"平和","id":"v007"},{"set":1,"en":"since","ja":"～以来、～から","id":"v008"},{"set":2,"en":"remind ～ of ...","ja":"～に…を思い出させる","id":"v009"},{"set":2,"en":"How long ～?","ja":"どれくらい（の時間）～ですか","id":"v010"},{"set":2,"en":"childhood","ja":"子供の頃、幼少期","id":"v011"},{"set":2,"en":"known","ja":"knowの過去分詞","id":"v012"},{"set":2,"en":"daughter","ja":"娘","id":"v013"},{"set":2,"en":"realize","ja":"～をはっきり理解する","id":"v014"},{"set":2,"en":"bombing","ja":"爆撃","id":"v015"},{"set":2,"en":"determined","ja":"決意した","source_note":"元画像は「determind」と表記されていました。学習用には determined に直しています。","id":"v016"},{"set":3,"en":"tragic","ja":"悲惨な、痛ましい","id":"v017"},{"set":3,"en":"promote","ja":"～を促進する","id":"v018"},{"set":3,"en":"be determined to ～","ja":"～することを決意している","source_note":"元画像は「be determind to ～」と表記されていました。学習用には determined に直しています。","id":"v019"},{"set":3,"en":"boyfriend","ja":"ボーイフレンド","id":"v020"},{"set":3,"en":"paint","ja":"（絵の具で・筆などで）～を描く","id":"v021"},{"set":3,"en":"textbook","ja":"教科書","id":"v022"},{"set":3,"en":"in line","ja":"列になって、並んで","id":"v023"},{"set":3,"en":"report","ja":"報告（書）、レポート","id":"v024"},{"set":4,"en":"valuable","ja":"価値のある、貴重な","source_note":"元画像の意味欄は「有名な、価値のある」でした。学習用には valuable の一般的な意味に直しています。","id":"v025"},{"set":4,"en":"though","ja":"～だけれども、しかし","source_note":"元画像では though の意味欄が空欄でした。学習用として意味を補っています。","id":"v026"},{"set":4,"en":"victim","ja":"犠牲者、被災者","id":"v027"},{"set":4,"en":"survivor","ja":"生存者","id":"v028"},{"set":4,"en":"generation","ja":"世代","id":"v029"},{"set":4,"en":"war","ja":"戦争","id":"v030"},{"set":4,"en":"past","ja":"［ふつう the ～ で］過去","id":"v031"},{"set":4,"en":"get older","ja":"年を取る","id":"v032"},{"set":5,"en":"year by year","ja":"年々（変化して）","id":"v033"},{"set":5,"en":"pass ～ on (to ...)","ja":"～を（…に）伝える","id":"v034"},{"set":5,"en":"fold","ja":"～を折る、～をたたむ","id":"v035"},{"set":5,"en":"paper","ja":"紙（の）","source_note":"元画像は「pepar」と表記されていました。学習用には paper に直しています。","id":"v036"},{"set":5,"en":"crane","ja":"ツル","id":"v037"},{"set":5,"en":"serve","ja":"（人に食べ物を）出す","id":"v038"},{"set":5,"en":"pickle","ja":"漬物、ピクルス","id":"v039"},{"set":5,"en":"machine","ja":"機械","id":"v040"},{"set":6,"en":"washing machine","ja":"洗濯機","id":"v041"},{"set":6,"en":"put on ～","ja":"～を着る、～を身につける","id":"v042"},{"set":6,"en":"alone","ja":"～だけで、一人で","id":"v043"},{"set":6,"en":"personal","ja":"個人の、個人的な","id":"v044"},{"set":6,"en":"pain","ja":"苦痛、苦しみ、痛み","id":"v045"},{"set":6,"en":"money","ja":"お金","id":"v046"},{"set":6,"en":"inspiration","ja":"鼓舞、刺激","id":"v047"},{"set":6,"en":"act","ja":"行動する、実行する","id":"v048"},{"set":7,"en":"in one's own words","ja":"自分自身の言葉で","id":"v049"},{"set":7,"en":"pass down ～","ja":"（知識など）を渡す","id":"v050"},{"set":7,"en":"～, such as ...","ja":"～、たとえば…","id":"v051"},{"set":7,"en":"think of ～","ja":"～のことを思い浮かべる","id":"v052"},{"set":7,"en":"take action","ja":"行動を起こす","id":"v053"},{"set":7,"en":"AI","ja":"人工知能","id":"v054"},{"set":7,"en":"device","ja":"デバイス","id":"v055"},{"set":8,"en":"daily","ja":"日常の、毎日の","id":"v056"},{"set":8,"en":"lately","ja":"最近、近頃","id":"v057"},{"set":8,"en":"search","ja":"検索","id":"v058"},{"set":8,"en":"engine","ja":"エンジン","id":"v059"},{"set":8,"en":"search engine","ja":"検索エンジン","id":"v060"},{"set":8,"en":"respond","ja":"反応（応答）する","id":"v061"},{"set":8,"en":"command","ja":"指示、命令","id":"v062"},{"set":8,"en":"common","ja":"普通の、よくある","id":"v063"},{"set":9,"en":"robot","ja":"ロボット","id":"v064"},{"set":9,"en":"automatically","ja":"自動で","id":"v065"},{"set":9,"en":"translation","ja":"翻訳","id":"v066"},{"set":9,"en":"software","ja":"ソフトウェア","id":"v067"},{"set":9,"en":"quite","ja":"非常に、とても","id":"v068"},{"set":9,"en":"easily","ja":"簡単に、楽に","id":"v069"},{"set":9,"en":"a part of ～","ja":"～の一部","id":"v070"},{"set":9,"en":"in the future","ja":"近い将来","id":"v071"},{"set":10,"en":"shape","ja":"～を形作る","id":"v072"},{"set":10,"en":"handy","ja":"使いやすい、便利な","id":"v073"},{"set":10,"en":"discussion","ja":"議論、討論","id":"v074"},{"set":10,"en":"customer","ja":"客、顧客","id":"v075"},{"set":10,"en":"rely","ja":"頼りにする、当てにする","id":"v076"},{"set":10,"en":"in my opinion","ja":"私の考えでは","id":"v077"},{"set":10,"en":"rely on ～","ja":"～を頼る、～を当てにする","id":"v078"},{"set":11,"en":"～ has a good point, but ...","ja":"～はいいところをついていると思うが…","id":"v079"},{"set":11,"en":"cleaning robot","ja":"ロボット掃除機","id":"v080"},{"set":11,"en":"weekday","ja":"平日","id":"v081"},{"set":11,"en":"ahead","ja":"前に、先に","id":"v082"},{"set":11,"en":"broaden","ja":"～を広げる、深める","id":"v083"},{"set":11,"en":"understanding","ja":"理解（すること）","id":"v084"},{"set":12,"en":"Go ahead.","ja":"どうぞ。","id":"v085"},{"set":12,"en":"On the other hand","ja":"一方で～。他方では～。","id":"v086"},{"set":12,"en":"magic","ja":"魔法の","id":"v087"},{"set":12,"en":"carpet","ja":"じゅうたん","id":"v088"},{"set":12,"en":"cape","ja":"ケープ（袖のないマント）","id":"v089"},{"set":12,"en":"disappear","ja":"見えなくなる","id":"v090"},{"set":12,"en":"somewhere","ja":"どこかに","id":"v091"},{"set":13,"en":"directly","ja":"直接、じかに","id":"v092"},{"set":13,"en":"hate","ja":"～をひどく嫌う","id":"v093"},{"set":13,"en":"tool","ja":"道具、手段、ツール","id":"v094"},{"set":13,"en":"translate","ja":"～を翻訳する","id":"v095"},{"set":13,"en":"too ～ to ...","ja":"…するには～すぎる","id":"v096"},{"set":13,"en":"take time","ja":"時間がかかる","id":"v097"},{"set":13,"en":"not all ～","ja":"全てが～とは限らない","id":"v098"},{"set":13,"en":"presentation","ja":"プレゼンテーション、発表","source_note":"元画像は「presettation」と表記されていました。学習用には presentation に直しています。","id":"v099"}];
const USERS_KEY='english_vocab_users_v1';
const ACTIVE_KEY='english_vocab_active_v1';
const STATE_PREFIX='english_vocab_state_v1_';

function makeCards(){
  const out=[];
  WORDS.forEach(w=>{
    out.push({id:w.id+'_ej',wordId:w.id,dir:'ej',set:w.set,q:w.en,a:w.ja,en:w.en,ja:w.ja,note:w.source_note||''});
    out.push({id:w.id+'_je',wordId:w.id,dir:'je',set:w.set,q:w.ja,a:w.en,en:w.en,ja:w.ja,note:w.source_note||''});
  });
  return out;
}
const CARDS=makeCards();

function freshState(){
  return {direction:'ej',set:'all',weakOnly:false,freqMin:0,weakIds:[],weakCounts:{},learnedIds:[],order:[],index:0,showAnswer:false,showStats:false};
}
let state=freshState(),users=[],activeUserId='';

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function userKey(id){return STATE_PREFIX+id}
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(users))}
function save(){if(activeUserId)localStorage.setItem(userKey(activeUserId),JSON.stringify(state))}
function loadUsers(){
  try{users=JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch(e){users=[]}
  if(!Array.isArray(users)||!users.length){
    const id='u_'+Date.now();users=[{id,name:'ユーザー1'}];saveUsers();localStorage.setItem(ACTIVE_KEY,id);
  }
  const saved=localStorage.getItem(ACTIVE_KEY);activeUserId=users.some(u=>u.id===saved)?saved:users[0].id;
}
function loadState(){
  state=freshState();
  try{const x=JSON.parse(localStorage.getItem(userKey(activeUserId))||'null');if(x)Object.assign(state,x)}catch(e){}
  if(!state.weakCounts||typeof state.weakCounts!=='object')state.weakCounts={};
  (state.weakIds||[]).forEach(id=>{if(!state.weakCounts[id])state.weakCounts[id]=1});
  state.freqMin=Number(state.freqMin||0);state.showStats=!!state.showStats;
}
function renderUsers(){
  const s=document.getElementById('userSelect');s.innerHTML='';
  users.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.name;o.selected=u.id===activeUserId;s.appendChild(o)});
}
function switchUser(id){save();activeUserId=id;localStorage.setItem(ACTIVE_KEY,id);loadState();renderUsers();render()}
function addUser(){
  const name=(prompt('ユーザー名を入力してください')||'').trim();if(!name)return;
  const id='u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);users.push({id,name:name.slice(0,30)});saveUsers();
  localStorage.setItem(userKey(id),JSON.stringify(freshState()));switchUser(id);
}
function deleteUser(){
  if(users.length<=1){alert('ユーザーは1人以上必要です。');return}
  const u=users.find(x=>x.id===activeUserId);if(!confirm(`「${u.name}」の学習記録を削除しますか？`))return;
  localStorage.removeItem(userKey(activeUserId));users=users.filter(x=>x.id!==activeUserId);saveUsers();
  activeUserId=users[0].id;localStorage.setItem(ACTIVE_KEY,activeUserId);loadState();renderUsers();render();
}
function weakTimes(id){return Number((state.weakCounts||{})[id]||0)}
function baseCards(){
  return CARDS.filter(c=>{
    const d=state.direction==='both'||c.dir===state.direction;
    const s=state.set==='all'||c.set===Number(state.set);
    return d&&s;
  });
}
function filteredCards(){
  let base=baseCards();
  if(state.weakOnly){const w=new Set(state.weakIds);base=base.filter(c=>w.has(c.id))}
  if(state.freqMin>0)base=base.filter(c=>weakTimes(c.id)>=state.freqMin).sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.set-b.set||a.wordId.localeCompare(b.wordId)||a.dir.localeCompare(b.dir));
  return base;
}
function sourceOrder(cards){
  return cards.slice().sort((a,b)=>a.set-b.set||a.wordId.localeCompare(b.wordId)||(a.dir==='ej'?-1:1));
}
function ensureOrder(){
  const base=filteredCards(),valid=new Set(base.map(c=>c.id));
  let ids=(Array.isArray(state.order)?state.order:[]).filter(id=>valid.has(id));
  sourceOrder(base).forEach(c=>{if(!ids.includes(c.id))ids.push(c.id)});
  state.order=ids;if(state.index>=ids.length)state.index=0;if(state.index<0)state.index=0;
}
function current(){ensureOrder();if(!state.order.length)return null;return CARDS.find(c=>c.id===state.order[state.index])||null}
function next(){ensureOrder();if(!state.order.length)return;state.index=(state.index+1)%state.order.length;state.showAnswer=false;save();render()}
function prev(){ensureOrder();if(!state.order.length)return;state.index=(state.index-1+state.order.length)%state.order.length;state.showAnswer=false;save();render()}
function markWeak(){
  const c=current();if(!c)return;state.weakCounts[c.id]=weakTimes(c.id)+1;
  if(!state.weakIds.includes(c.id))state.weakIds.push(c.id);state.learnedIds=state.learnedIds.filter(id=>id!==c.id);next();
}
function markLearned(){
  const c=current();if(!c)return;if(!state.learnedIds.includes(c.id))state.learnedIds.push(c.id);state.weakIds=state.weakIds.filter(id=>id!==c.id);
  if(state.weakOnly){state.order=state.order.filter(id=>id!==c.id);if(state.index>=state.order.length)state.index=0;state.showAnswer=false;save();render()}else next();
}
function shuffle(){
  ensureOrder();for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}
  state.index=0;state.showAnswer=false;save();render();
}
function resetOrder(){state.order=sourceOrder(filteredCards()).map(c=>c.id);state.index=0;state.showAnswer=false;save();render()}
function speakEnglish(text){
  if(!('speechSynthesis' in window)){alert('この端末では音声読み上げに対応していません。');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replaceAll('～','').replaceAll('...',''));
  u.lang='en-US';u.rate=.88;speechSynthesis.speak(u);
}
function aiAsk(c){
  const prompt=`中学生の高校入試向け英単語を教えてください。\n英語：${c.en}\n日本語：${c.ja}\n意味、品詞、覚え方、短い例文と日本語訳、よくある使い方を分かりやすく説明してください。`;
  window.open('https://www.perplexity.ai/search?q='+encodeURIComponent(prompt),'_blank','noopener');
}
function webSearch(c){window.open('https://www.google.com/search?q='+encodeURIComponent(`${c.en} 英語 意味 例文 発音`),'_blank','noopener')}
function renderStats(){
  const p=document.getElementById('statsPanel');if(!state.showStats){p.style.display='none';p.innerHTML='';return}
  const rows=baseCards().filter(c=>weakTimes(c.id)>0).sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.set-b.set).slice(0,20);
  p.style.display='block';
  if(!rows.length){p.innerHTML='<div class="empty">まだ「覚えていない」の集計がありません。</div>';return}
  p.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px"><b>📊 苦手ランキング（上位20問）</b>'+
    rows.map((c,i)=>`<div style="display:grid;grid-template-columns:32px 1fr auto;gap:8px;padding:7px 0;border-top:${i?'1px solid var(--line)':'0'}"><span>${i+1}</span><span>${esc(c.en)} → ${esc(c.ja)}</span><b style="color:var(--red)">${weakTimes(c.id)}回</b></div>`).join('')+'</div>';
}
function render(){
  document.getElementById('direction').value=state.direction;document.getElementById('setSel').value=state.set;document.getElementById('freqMin').value=String(state.freqMin||0);
  const w=document.getElementById('weakOnly');w.textContent='覚えていないだけ：'+(state.weakOnly?'ON':'OFF');w.classList.toggle('active',state.weakOnly);
  ensureOrder();const c=current();
  document.getElementById('progress').textContent=state.order.length?`${state.index+1} / ${state.order.length}`:'0 / 0';
  document.getElementById('weakCount').textContent='覚えていない '+state.weakIds.length;
  document.getElementById('learnedCount').textContent='覚えた '+state.learnedIds.length;
  document.getElementById('freqCount').textContent='2回以上ミス '+baseCards().filter(x=>weakTimes(x.id)>=2).length;
  renderStats();
  const main=document.getElementById('main');
  if(!c){main.innerHTML='<div class="empty"><b>表示する問題がありません。</b><br>条件を変えるか、通常モードに戻してください。</div>';return}
  const dirLabel=c.dir==='ej'?'英語 → 日本語':'日本語 → 英語';
  main.innerHTML=`
    <button class="card" id="card" type="button">
      <div class="meta">セット${c.set}　${dirLabel}</div>
      <div class="side">${state.showAnswer?'答え':'問題'}</div>
      <div class="${state.showAnswer?'answer':'question'}">${esc(state.showAnswer?c.a:c.q)}</div>
      <div class="status" style="margin-top:14px;margin-bottom:0"><span class="chip">覚えていない累計 ${weakTimes(c.id)}回</span></div>
      ${state.showAnswer&&c.note?`<div class="noteBox">※ ${esc(c.note)}</div>`:''}
      <div class="hint">カードをタッチすると${state.showAnswer?'問題に戻ります':'答えが出ます'}</div>
    </button>
    <div class="lookup">
      <button id="speakBtn">🔊 発音</button>
      ${state.showAnswer?'<button id="aiBtn">🤖 AIに聞く</button><button id="searchBtn">🔎 Web検索</button>':''}
    </div>
    <div class="actions"><button class="danger" id="weakBtn">覚えていない</button><button class="success" id="learnedBtn">覚えた</button></div>
    <div class="nav"><button id="prevBtn">← 前へ</button><button id="flipBtn">${state.showAnswer?'問題を見る':'答えを見る'}</button><button id="nextBtn">次へ →</button><button id="removeWeakBtn">要復習から外す</button></div>`;
  document.getElementById('card').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};
  document.getElementById('flipBtn').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};
  document.getElementById('prevBtn').onclick=prev;document.getElementById('nextBtn').onclick=next;
  document.getElementById('weakBtn').onclick=markWeak;document.getElementById('learnedBtn').onclick=markLearned;
  document.getElementById('removeWeakBtn').onclick=()=>{state.weakIds=state.weakIds.filter(id=>id!==c.id);save();render()};
  document.getElementById('speakBtn').onclick=()=>speakEnglish(c.en);
  if(state.showAnswer){document.getElementById('aiBtn').onclick=()=>aiAsk(c);document.getElementById('searchBtn').onclick=()=>webSearch(c)}
}
document.getElementById('userSelect').onchange=e=>switchUser(e.target.value);
document.getElementById('addUser').onclick=addUser;document.getElementById('deleteUser').onclick=deleteUser;
document.getElementById('direction').onchange=e=>{state.direction=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('setSel').onchange=e=>{state.set=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('weakOnly').onclick=()=>{state.weakOnly=!state.weakOnly;if(state.weakOnly)state.freqMin=0;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('freqMin').onchange=e=>{state.freqMin=Number(e.target.value||0);if(state.freqMin>0)state.weakOnly=false;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('showStats').onclick=()=>{state.showStats=!state.showStats;save();render()};
document.getElementById('shuffle').onclick=shuffle;document.getElementById('resetOrder').onclick=resetOrder;
document.getElementById('clearWeak').onclick=()=>{if(confirm('「覚えていない」の現在の登録をすべて消しますか？\n※累計ミス回数は残します。')){state.weakIds=[];state.order=[];state.index=0;save();render()}};
document.getElementById('clearAll').onclick=()=>{if(confirm('このユーザーの学習記録と苦手頻度をすべてリセットしますか？')){state=freshState();save();render()}};
loadUsers();loadState();renderUsers();render();
</script>
</body>
</html>
