<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>高校入試 漢字 一問一答</title>
<style>
:root {
  --bg:#f4f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280;
  --line:#d9dee8; --blue:#2563eb; --blue-soft:#eaf2ff;
  --red:#dc2626; --red-soft:#feecec; --green:#087a55; --green-soft:#e7f8f0;
  --amber:#b86a00; --shadow:0 10px 28px rgba(24,39,75,.09);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 32px}
h1{font-size:1.3rem;margin:4px 0 12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.grid{display:grid;gap:9px}
.userbar{grid-template-columns:1fr auto auto;margin-bottom:11px}
.filters{grid-template-columns:1fr 1fr;margin-bottom:9px}
.tools{grid-template-columns:repeat(3,1fr);margin-bottom:10px}.freqbar{grid-template-columns:1fr 1fr;margin-bottom:10px}
select,button{min-height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-size:15px;padding:9px 11px}
button{cursor:pointer;font-weight:600}
button:active{transform:translateY(1px)}
button.primary{background:var(--blue-soft);border-color:#a9c8ff}
button.danger{background:var(--red-soft);border-color:#f4b7b7;color:#9b1c1c}
button.success{background:var(--green-soft);border-color:#a9ddca;color:#075f43}
button.active{outline:3px solid rgba(37,99,235,.16);border-color:#7caafc}
.status{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 11px}
.chip{font-size:13px;background:white;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.card{width:100%;text-align:left;min-height:270px;background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);padding:18px 17px}
.meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.side{font-size:13px;color:var(--muted);margin-bottom:8px}
.question{font-size:1.28rem;line-height:1.9;font-weight:650;word-break:break-word}
.target{font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;color:#111827}
.answer{font-size:2rem;line-height:1.45;font-weight:800;color:var(--red);margin:8px 0 5px}
.answerLabel{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:18px}
.actions,.nav,.lookup{display:grid;gap:9px;margin-top:10px}
.actions{grid-template-columns:1fr 1fr}
.nav{grid-template-columns:1fr 1fr}
.lookup{grid-template-columns:1fr 1fr}
.lookup button{font-size:14px;font-weight:600}
.empty{background:white;border:1px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;color:var(--muted);line-height:1.7}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
.sectionTitle{font-size:12px;color:var(--muted);margin:4px 0 5px}
@media(min-width:700px){
  .filters{grid-template-columns:1fr 1fr 1fr}
  .tools{grid-template-columns:repeat(4,1fr)}
  .nav{grid-template-columns:repeat(4,1fr)}
  .card{min-height:310px;padding:24px}
  .question{font-size:1.45rem}
}

.homeLink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);text-decoration:none;font-size:13px;font-weight:650}
.homeLink:active{transform:translateY(1px)}

</style>
</head>

<div class="wrap">
<a class="homeLink" href="../">← ホームへ戻る</a>
  <h1>高校入試 漢字 一問一答</h1>

  <div class="sectionTitle">学習するユーザー</div>
  <div class="grid userbar">
    <select id="userSelect" aria-label="ユーザー"></select>
    <button id="addUser">＋追加</button>
    <button id="deleteUser">削除</button>
  </div>

  <div class="grid filters">
    <div>
      <label for="mode">出題</label>
      <select id="mode">
        <option value="both">読み＋書き</option>
        <option value="read">読み取り</option>
        <option value="write">書き取り</option>
      </select>
    </div>
    <div>
      <label for="round">回</label>
      <select id="round">
        <option value="all">全15回</option>
        <option value="1">第1回</option><option value="2">第2回</option><option value="3">第3回</option><option value="4">第4回</option><option value="5">第5回</option><option value="6">第6回</option><option value="7">第7回</option><option value="8">第8回</option><option value="9">第9回</option><option value="10">第10回</option><option value="11">第11回</option><option value="12">第12回</option><option value="13">第13回</option><option value="14">第14回</option><option value="15">第15回</option>
      </select>
    </div>
    <div>
      <label>復習</label>
      <button id="weakOnly" class="primary" style="width:100%">覚えていないだけ：OFF</button>
    </div>
  </div>

  <div class="grid tools">
    <button id="shuffle">シャッフル</button>
    <button id="resetOrder">番号順に戻す</button>
    <button id="clearWeak">要復習を消す</button>
    <button id="clearAll">このユーザーをリセット</button>
  </div>
  <div class="grid freqbar">
    <select id="freqMin">
      <option value="0">苦手頻度：通常</option>
      <option value="2">2回以上ミスだけ</option>
      <option value="3">3回以上ミスだけ</option>
      <option value="5">5回以上ミスだけ</option>
      <option value="10">10回以上ミスだけ</option>
    </select>
    <button id="showStats">📊 苦手集計を見る</button>
  </div>

  <div class="status">
    <span class="chip" id="progress">0 / 0</span>
    <span class="chip" id="weakCount">覚えていない 0</span>
    <span class="chip" id="learnedCount">覚えた 0</span>
    <span class="chip" id="freqCount">2回以上ミス 0</span>
    <span class="chip" id="modeInfo"></span>
  </div>

  <div id="statsPanel" style="display:none;margin-bottom:11px;"></div>
  <div id="main"></div>

  <div class="note">
    問題の下線部分が対象です。カードをタッチすると答えが出ます。<br>
    「覚えていない」を押した回数も問題ごとに記録します。「2回以上ミスだけ」などを選ぶと、よく間違える問題だけを頻度順に復習できます。記録はユーザーごとに、この端末のブラウザ内へ保存されます。
  </div>
</div>

const USERS_KEY='hs_kanji_users_v1';
const ACTIVE_KEY='hs_kanji_active_user_v1';
const STATE_PREFIX='hs_kanji_state_v1_';

function freshState(){
  return {mode:'both',round:'1',weakOnly:false,freqMin:0,weakIds:[],weakCounts:{},learnedIds:[],order:[],index:0,showAnswer:false,showStats:false};
}
let state=freshState(), users=[], activeUserId='';

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function userKey(id){return STATE_PREFIX+id}
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(users))}
function save(){
  if(activeUserId)localStorage.setItem(userKey(activeUserId),JSON.stringify(state));
}
function loadUsers(){
  try{users=JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch(e){users=[]}
  if(!Array.isArray(users)||!users.length){
    const id='u_'+Date.now();
    users=[{id,name:'ユーザー1'}]; saveUsers();
    localStorage.setItem(ACTIVE_KEY,id);
  }
  const saved=localStorage.getItem(ACTIVE_KEY);
  activeUserId=users.some(u=>u.id===saved)?saved:users[0].id;
}
function loadState(){
  state=freshState();
  try{const x=JSON.parse(localStorage.getItem(userKey(activeUserId))||'null');if(x)Object.assign(state,x)}catch(e){}
  if(!state.weakCounts||typeof state.weakCounts!=='object')state.weakCounts={};
  (state.weakIds||[]).forEach(id=>{if(!state.weakCounts[id])state.weakCounts[id]=1;});
  state.freqMin=Number(state.freqMin||0);
  state.showStats=!!state.showStats;
}
function renderUsers(){
  const sel=document.getElementById('userSelect'); sel.innerHTML='';
  users.forEach(u=>{
    const o=document.createElement('option');o.value=u.id;o.textContent=u.name;o.selected=u.id===activeUserId;sel.appendChild(o);
  });
}
function switchUser(id){
  save(); activeUserId=id; localStorage.setItem(ACTIVE_KEY,id); loadState(); renderUsers(); render();
}
function addUser(){
  const name=(prompt('ユーザー名を入力してください')||'').trim();if(!name)return;
  const id='u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  users.push({id,name:name.slice(0,30)});saveUsers();
  localStorage.setItem(userKey(id),JSON.stringify(freshState()));switchUser(id);

function deleteUser(){
  if(users.length<=1){alert('ユーザーは1人以上必要です。');return}

  if(!confirm(`「${u.name}」の漢字学習記録を削除しますか？`))return;
  localStorage.removeItem(userKey(activeUserId));
  users=users.filter(x=>x.id!==activeUserId);saveUsers();
  activeUserId=users[0].id;localStorage.setItem(ACTIVE_KEY,activeUserId);loadState();renderUsers();render();
}
function baseCards(){
  return CARDS.filter(c=>{
    const m=state.mode==='both'||c.mode===state.mode;
    const r=state.round==='all'||c.round===Number(state.round);
    return m&&r;
  });
}
function weakTimes(id){return Number((state.weakCounts||{})[id]||0);}
function filteredCards(){
  let base=baseCards();
  if(state.weakOnly){
    const w=new Set(state.weakIds);base=base.filter(c=>w.has(c.id));
  }
  if(state.freqMin>0){
    base=base.filter(c=>weakTimes(c.id)>=state.freqMin)
      .sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.round-b.round||(a.mode===b.mode?0:(a.mode==='read'?-1:1))||a.num-b.num);
  }
  return base;
}
function sourceOrder(cards){
  return cards.slice().sort((a,b)=>a.round-b.round || (a.mode===b.mode?0:(a.mode==='read'?-1:1)) || a.num-b.num);
}
function ensureOrder(){
  const base=filteredCards(), valid=new Set(base.map(c=>c.id));
  let ids=(Array.isArray(state.order)?state.order:[]).filter(id=>valid.has(id));
  const missing=sourceOrder(base).map(c=>c.id).filter(id=>!ids.includes(id));
  state.order=ids.concat(missing);
  if(state.index>=state.order.length)state.index=0;
  if(state.index<0)state.index=0;
}
function current(){
  ensureOrder();if(!state.order.length)return null;
  const id=state.order[state.index];return CARDS.find(c=>c.id===id)||null;
}
function markedQuestion(c){
  const q=c.q, st=c.targetStart, en=c.targetEnd;
  if(st<0||en<=st)return esc(q);
  return esc(q.slice(0,st))+'<span class="target">'+esc(q.slice(st,en))+'</span>'+esc(q.slice(en));
}
function next(){
  ensureOrder();if(!state.order.length)return;
  state.index=(state.index+1)%state.order.length;state.showAnswer=false;save();render();
}
function prev(){
  ensureOrder();if(!state.order.length)return;
  state.index=(state.index-1+state.order.length)%state.order.length;state.showAnswer=false;save();render();
}
function markWeak(){
  const c=current();if(!c)return;
  state.weakCounts[c.id]=weakTimes(c.id)+1;
  if(!state.weakIds.includes(c.id))state.weakIds.push(c.id);
  state.learnedIds=state.learnedIds.filter(id=>id!==c.id);
  next();
}
function markLearned(){
  const c=current();if(!c)return;
  if(!state.learnedIds.includes(c.id))state.learnedIds.push(c.id);
  state.weakIds=state.weakIds.filter(id=>id!==c.id);
  if(state.weakOnly){
    state.order=state.order.filter(id=>id!==c.id);
    if(state.index>=state.order.length)state.index=0;
    state.showAnswer=false;save();render();
  }else next();
}
function shuffle(){
  ensureOrder();
  for(let i=state.order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]];
  }
  state.index=0;state.showAnswer=false;save();render();
}
function resetOrder(){
  state.order=sourceOrder(filteredCards()).map(c=>c.id);state.index=0;state.showAnswer=false;save();render();
}

function renderStats(){
  const panel=document.getElementById('statsPanel');if(!panel)return;
  if(!state.showStats){panel.style.display='none';panel.innerHTML='';return;}
  const rows=baseCards().filter(c=>weakTimes(c.id)>0)
    .sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.round-b.round||(a.mode===b.mode?0:(a.mode==='read'?-1:1))||a.num-b.num)
    .slice(0,20);

}
function render(){
  document.getElementById('mode').value=state.mode;
  document.getElementById('round').value=state.round;document.getElementById('freqMin').value=String(state.freqMin||0);
  const wb=document.getElementById('weakOnly');

  const c=current();

  document.getElementById('weakCount').textContent='覚えていない '+state.weakIds.length;
  document.getElementById('learnedCount').textContent='覚えた '+state.learnedIds.length;document.getElementById('freqCount').textContent='2回以上ミス '+baseCards().filter(c=>weakTimes(c.id)>=2).length;renderStats();
  const m=state.mode==='read'?'読み取り':state.mode==='write'?'書き取り':'読み＋書き';
  const r=state.round==='all'?'全15回':`第${state.round}回`;
  document.getElementById('modeInfo').textContent=`${r} / ${m}`;
  const main=document.getElementById('main');
  if(!c){
    main.innerHTML='<div class="empty"><b>表示する問題がありません。</b><br>「覚えていないだけ」がONの場合は、先に問題を「覚えていない」に登録してください。</div>';
    return;
  }
  const kind=c.mode==='read'?'読み取り':'書き取り';
  const answerLabel=c.mode==='read'?'読み':'漢字';
  main.innerHTML=`
    <button class="card" id="card" type="button">
      <div>
        <div class="meta">第${c.round}回　${kind}　No.${c.num}</div>
        <div class="side">${state.showAnswer?'答え':'問題'}</div>
        ${state.showAnswer
          ? `<div class="question">${markedQuestion(c)}</div><div class="answerLabel">${answerLabel}</div><div class="answer">${esc(c.answer)}</div>`
          : `<div class="question">${markedQuestion(c)}</div>`}
        <div class="status" style="margin-top:14px;margin-bottom:0"><span class="chip">覚えていない累計 ${weakTimes(c.id)}回</span></div>
        <div class="hint">カードをタッチすると${state.showAnswer?'問題に戻ります':'答えが出ます'}</div>
      </div>
    </button>
    ${state.showAnswer?`
      <div class="lookup">
        <button id="aiBtn">🤖 AIに聞く</button>
        <button id="searchBtn">🔎 Web検索</button>
      </div>`:''}
    <div class="actions">
      <button class="danger" id="weakBtn">覚えていない</button>
      <button class="success" id="learnedBtn">覚えた</button>
    </div>
    <div class="nav">
      <button id="prevBtn">← 前へ</button>
      <button id="flipBtn">${state.showAnswer?'問題を見る':'答えを見る'}</button>
      <button id="nextBtn">次へ →</button>
      <button id="removeWeakBtn">要復習から外す</button>
    </div>`;
  document.getElementById('card').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};
  document.getElementById('flipBtn').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};
  document.getElementById('prevBtn').onclick=prev;
  document.getElementById('nextBtn').onclick=next;
  document.getElementById('weakBtn').onclick=markWeak;
  document.getElementById('learnedBtn').onclick=markLearned;
  document.getElementById('removeWeakBtn').onclick=()=>{
    state.weakIds=state.weakIds.filter(id=>id!==c.id);save();render();
  };
  if(state.showAnswer){
    document.getElementById('aiBtn').onclick=()=>aiAsk(c);
    document.getElementById('searchBtn').onclick=()=>webSearch(c);
  }
}
document.getElementById('userSelect').onchange=e=>switchUser(e.target.value);
document.getElementById('addUser').onclick=addUser;
document.getElementById('deleteUser').onclick=deleteUser;
document.getElementById('mode').onchange=e=>{state.mode=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('round').onchange=e=>{state.round=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('weakOnly').onclick=()=>{state.weakOnly=!state.weakOnly;if(state.weakOnly)state.freqMin=0;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('freqMin').onchange=e=>{state.freqMin=Number(e.target.value||0);if(state.freqMin>0)state.weakOnly=false;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('showStats').onclick=()=>{state.showStats=!state.showStats;save();render()};
document.getElementById('shuffle').onclick=shuffle;
document.getElementById('resetOrder').onclick=resetOrder;
document.getElementById('clearWeak').onclick=()=>{
  if(confirm('「覚えていない」の記録をすべて消しますか？')){state.weakIds=[];state.order=[];state.index=0;save();render()}
};
document.getElementById('clearAll').onclick=()=>{
  if(confirm('このユーザーの「覚えた／覚えていない」と学習位置をすべてリセットしますか？')){state=freshState();save();render()}
};
loadUsers();loadState();renderUsers();render();
</script>
</body>
</html>
