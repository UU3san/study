<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><title>中3 英文音読</title><style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;--blue:#2563eb;--green:#087a55;--red:#c62828;--yellow:#fff3bf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:14px 12px 30px}h1{font-size:1.3rem}.home{display:inline-block;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:650;font-size:13px}select,button{min-height:46px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px;padding:8px 10px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(24,39,75,.08)}.meta{font-size:13px;color:var(--muted);margin-bottom:8px}.sentence{font-size:1.5rem;line-height:1.75;font-weight:700}.word{display:inline;border:0;background:transparent;padding:1px 2px;min-height:0;font:inherit;font-weight:inherit;border-radius:6px;text-decoration:underline dotted #9aa4b2}.translation{margin-top:12px;background:#f8fafc;border-radius:12px;padding:10px;line-height:1.6}.meaning{margin-top:10px;background:var(--yellow);border:1px solid #ead47a;border-radius:12px;padding:11px;display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.record{background:#eaf2ff;border-color:#a9c8ff;font-weight:700}.stop{background:#feecec;border-color:#f3bbbb}.result{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.65}.score{font-size:1.5rem;font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}.wordcheck{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ok,.ng{padding:4px 7px;border-radius:8px;font-size:13px}.ok{background:#e7f8f0}.ng{background:#feecec}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}button:disabled{opacity:.4}@media(max-width:650px){.controls{grid-template-columns:1fr}.sentence{font-size:1.28rem}}
</style></head><body><div class="wrap"><a class="home" href="../">← ホームへ戻る</a><h1>中3 英文音読トレーニング</h1><div class="controls"><select id="sentenceSelect"></select><button id="prevBtn">← 前へ</button><button id="nextBtn">次へ →</button></div><div id="main"></div><div class="note">単語をタップすると、その英文の中での意味を表示します。音読評価はスマホの音声認識結果と英文を比較した目安です。iPhoneではマイク許可が必要です。</div></div>
<script>
const PASSAGE=[{"speaker": "", "text": "This is the Atomic Bomb Dome.", "translation": "これは原爆ドームです。", "meanings": {"This": "これは", "is": "～です", "the": "その", "Atomic": "原子の", "Bomb": "爆弾", "Dome": "ドーム"}}, {"speaker": "", "text": "The world's first atomic bomb was dropped near here at 8:15 a.m. on August 6, 1945.", "translation": "世界で最初の原子爆弾は、1945年8月6日の午前8時15分にこの近くへ投下されました。", "meanings": {"The": "その", "world's": "世界の", "first": "最初の", "atomic": "原子の", "bomb": "爆弾", "was": "～された", "dropped": "投下された", "near": "～の近くに", "here": "ここ", "at": "～に（時刻）", "8:15": "8時15分", "a.m.": "午前", "on": "～に（日付）", "August": "8月", "6": "6日", "1945": "1945年"}}, {"speaker": "", "text": "The dome has been like this for about 80 years.", "translation": "そのドームは約80年間、このような状態のままです。", "meanings": {"The": "その", "dome": "ドーム", "has": "現在完了を作る", "been": "be の過去分詞", "like": "～のような", "this": "このような", "for": "～の間", "about": "約", "80": "80", "years": "年間"}}, {"speaker": "", "text": "It reminds us of the horrors of the atomic bomb.", "translation": "それは私たちに原子爆弾の恐ろしさを思い起こさせます。", "meanings": {"It": "それは", "reminds": "思い出させる", "us": "私たちに", "of": "～を／～について", "the": "その", "horrors": "恐ろしさ・恐怖", "atomic": "原子の", "bomb": "爆弾"}}, {"speaker": "", "text": "It's also a reminder of our mission to work for peace.", "translation": "それはまた、平和のために取り組むという私たちの使命を思い出させるものでもあります。", "meanings": {"It's": "It is の短縮形", "also": "また", "a": "1つの", "reminder": "思い出させるもの", "of": "～についての", "our": "私たちの", "mission": "使命", "to": "～すること", "work": "取り組む", "for": "～のために", "peace": "平和"}}, {"speaker": "Ms. Nishimura", "text": "Does anyone have any questions?", "translation": "何か質問がある人はいますか。", "meanings": {"Does": "疑問文を作る助動詞", "anyone": "誰か", "have": "持っている／ある", "any": "何か", "questions": "質問"}}, {"speaker": "Tina", "text": "How long have you been a peace volunteer?", "translation": "あなたはどのくらいの間、平和活動のボランティアをしているのですか。", "meanings": {"How": "どのくらい", "long": "長く／どのくらいの間", "have": "現在完了を作る", "you": "あなたは", "been": "be の過去分詞", "a": "1人の", "peace": "平和", "volunteer": "ボランティア"}}, {"speaker": "Ms. Nishimura", "text": "I've been a volunteer since 2000.", "translation": "私は2000年からずっとボランティアをしています。", "meanings": {"I've": "I have の短縮形", "been": "be の過去分詞", "a": "1人の", "volunteer": "ボランティア", "since": "～以来／～からずっと", "2000": "2000年"}}, {"speaker": "Tina", "text": "That's a long time!", "translation": "それは長いですね！", "meanings": {"That's": "That is の短縮形", "a": "1つの", "long": "長い", "time": "時間"}}];let idx=0,recognition=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalize(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){return normalize(s).split(' ').filter(Boolean)}
function scoreSpeech(target,heard){const a=tokens(target),b=tokens(heard);const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c)}const score=Math.max(0,Math.round((1-dp[a.length][b.length]/Math.max(a.length,b.length,1))*100));const bs=new Set(b);return{score,checks:a.map(w=>[w,bs.has(w)])}}
function render(){const d=PASSAGE[idx],sel=document.getElementById('sentenceSelect');sel.innerHTML=PASSAGE.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>${i+1}. ${x.speaker?x.speaker+'：':''}${x.text.slice(0,38)}${x.text.length>38?'…':''}</option>`).join('');const parts=d.text.match(/[A-Za-z0-9]+(?:['’][A-Za-z]+)?|a\.m\.|[^A-Za-z0-9\s]+/g)||[];const words=parts.map(tok=>{const clean=tok.replace(/[.,!?]/g,'');const key=Object.keys(d.meanings).find(k=>normalize(k)===normalize(clean));return key?`<button class="word" data-word="${esc(key)}">${esc(tok)}</button>`:esc(tok)}).join(' ');document.getElementById('main').innerHTML=`<div class="card"><div class="meta">${d.speaker?esc(d.speaker)+'：':''}文 ${idx+1} / ${PASSAGE.length}</div><div class="sentence">${words}</div><div class="translation">${esc(d.translation)}</div><div class="meaning" id="meaningBox"></div><div class="actions"><button class="record" id="startBtn">🎤 音読して評価</button><button class="stop" id="stopBtn" disabled>■ 停止</button></div><div id="result"></div></div>`;document.querySelectorAll('.word').forEach(b=>b.onclick=()=>{const key=b.dataset.word,box=document.getElementById('meaningBox');box.style.display='block';box.innerHTML=`<b>${esc(key)}</b>：${esc(d.meanings[key]||'')}`});document.getElementById('startBtn').onclick=startRecognition;document.getElementById('stopBtn').onclick=()=>recognition&&recognition.stop()}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('result').innerHTML='<div class="result bad">このブラウザでは音声認識が使えません。Safari/Chromeの最新版で試してください。</div>';return}recognition=new SR();recognition.lang='en-US';recognition.interimResults=true;recognition.continuous=false;let finalText='';recognition.onstart=()=>{document.getElementById('startBtn').disabled=true;document.getElementById('stopBtn').disabled=false;document.getElementById('result').innerHTML='<div class="result">🎤 聞き取り中です…英文を声に出して読んでください。</div>'};recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';finalText=t.trim();document.getElementById('result').innerHTML=`<div class="result">聞き取り：${esc(finalText)}</div>`};recognition.onerror=e=>document.getElementById('result').innerHTML=`<div class="result bad">音声認識エラー：${esc(e.error)}。マイク許可も確認してください。</div>`;recognition.onend=()=>{document.getElementById('startBtn').disabled=false;document.getElementById('stopBtn').disabled=true;if(finalText)showScore(finalText)};recognition.start()}
function showScore(heard){const r=scoreSpeech(PASSAGE[idx].text,heard),cls=r.score>=85?'good':r.score<65?'bad':'';document.getElementById('result').innerHTML=`<div class="result"><div class="score ${cls}">一致度 ${r.score}点</div><div><b>聞き取った英文：</b>${esc(heard)}</div><div class="wordcheck">${r.checks.map(([w,ok])=>`<span class="${ok?'ok':'ng'}">${ok?'✓':'△'} ${esc(w)}</span>`).join('')}</div><div style="font-size:12px;color:#6b7280;margin-top:8px">※発音そのものを直接採点するのではなく、スマホが英語としてどれだけ正しく認識できたかの目安です。</div></div>`}
document.getElementById('sentenceSelect').onchange=e=>{idx=Number(e.target.value);render()};document.getElementById('prevBtn').onclick=()=>{idx=(idx-1+PASSAGE.length)%PASSAGE.length;render()};document.getElementById('nextBtn').onclick=()=>{idx=(idx+1)%PASSAGE.length;render()};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../service-worker.js'));
</script></body></html>
