: {}}, {"speaker": "David", "text": "One of my dogs is a Japanese Akita.", "translation": "犬のうち1匹は日本の秋田犬です。", "meanings": {}}, {"speaker": "David", "text": "I want to visit Japan someday!", "translation": "いつか日本を訪れたいです！", "meanings": {}}, {"speaker": "Riko", "text": "Hi, I'm Riko.", "translation": "こんにちは、私は理子です。", "meanings": {}}, {"speaker": "Riko", "text": "You have a lot of animals!", "translation": "たくさん動物を飼っていますね！", "meanings": {}}, {"speaker": "Riko", "text": "I have some rabbits.", "translation": "私はウサギを何匹か飼っています。", "meanings": {}}, {"speaker": "David", "text": "Great!", "translation": "いいですね！", "meanings": {}}, {"speaker": "David", "text": "How many rabbits do you have?", "translation": "ウサギを何匹飼っていますか。", "meanings": {}}, {"speaker": "Riko", "text": "I have three rabbits.", "translation": "3匹飼っています。", "meanings": {}}, {"speaker": "Riko", "text": "They're so cute!", "translation": "とてもかわいいです！", "meanings": {}}]}, {"id": "J1-U4-P2", "grade": "中1", "unit": "Unit4", "code": "Part2", "title": "Friends in New Zealand｜時刻・すること", "sentences": [{"speaker": "Riko", "text": "It's noon in Japan now.", "translation": "日本は今、正午です。", "meanings": {}}, {"speaker": "Riko", "text": "What time is it in New Zealand?", "translation": "ニュージーランドは何時ですか。", "meanings": {}}, {"speaker": "Mia", "text": "It's three in the afternoon.", "translation": "午後3時です。", "meanings": {}}, {"speaker": "Mia", "text": "This is our last class today.", "translation": "これは今日最後の授業です。", "meanings": {}}, {"speaker": "Riko", "text": "What do you do after school?", "translation": "放課後は何をしますか。", "meanings": {}}, {"speaker": "Mia", "text": "I usually play sports.", "translation": "たいていスポーツをします。", "meanings": {}}, {"speaker": "Riko", "text": "What sports do you play?", "translation": "どんなスポーツをしますか。", "meanings": {}}, {"speaker": "Mia", "text": "I play soccer, tennis, netball, ....", "translation": "サッカー、テニス、ネットボールなどをします。", "meanings": {}}, {"speaker": "Riko", "text": "Netball?", "translation": "ネットボール？", "meanings": {}}, {"speaker": "Mia", "text": "Yes.", "translation": "はい。", "meanings": {}}, {"speaker": "Mia", "text": "It's a sport like basketball.", "translation": "バスケットボールのようなスポーツです。", "meanings": {}}, {"speaker": "Riko", "text": "Sounds interesting!", "translation": "おもしろそうですね！", "meanings": {}}]}, {"id": "J1-U4-P3", "grade": "中1", "unit": "Unit4", "code": "Part3", "title": "Friends in New Zealand｜指示・助言", "sentences": [{"speaker": "Mr. Tani", "text": "Jun.", "translation": "ジュン。", "meanings": {}}, {"speaker": "Mr. Tani", "text": "It's your turn.", "translation": "あなたの番です。", "meanings": {}}, {"speaker": "Mr. Tani", "text": "Come to the front, please.", "translation": "前へ来てください。", "meanings": {}}, {"speaker": "Jun", "text": "Me?", "translation": "僕ですか。", "meanings": {}}, {"speaker": "Jun", "text": "Oh, no.", "translation": "ええ、いやだな。", "meanings": {}}, {"speaker": "Riko", "text": "Be brave.", "translation": "勇気を出して。", "meanings": {}}, {"speaker": "Riko", "text": "You can do it.", "translation": "あなたならできます。", "meanings": {}}, {"speaker": "Jun", "text": "I'm so nervous.", "translation": "とても緊張しています。", "meanings": {}}, {"speaker": "Mr. Tani", "text": "Don't worry.", "translation": "心配しないで。", "meanings": {}}, {"speaker": "Mr. Tani", "text": "Enjoy yourself.", "translation": "楽しんで。", "meanings": {}}, {"speaker": "Jun", "text": "What animals can we see in New Zealand?", "translation": "ニュージーランドではどんな動物を見ることができますか。", "meanings": {}}, {"speaker": "Mia", "text": "You can see sheep, kiwis, ....", "translation": "ヒツジやキーウィなどを見ることができます。", "meanings": {}}, {"speaker": "Jun", "text": "Kiwis?", "translation": "キーウィ？", "meanings": {}}, {"speaker": "Jun", "text": "Kiwis are fruit, right?", "translation": "キーウィは果物ですよね。", "meanings": {}}, {"speaker": "Mia", "text": "Yes, but kiwis are birds, too.", "translation": "はい、でもキーウィは鳥でもあります。", "meanings": {}}, {"speaker": "Mia", "text": "Look at my T-shirt.", "translation": "私のTシャツを見てください。", "meanings": {}}, {"speaker": "Mia", "text": "This is a kiwi.", "translation": "これはキーウィです。", "meanings": {}}, {"speaker": "Jun", "text": "Oh, it's cute!", "translation": "ああ、かわいいですね！", "meanings": {}}]}, {"id": "J1-U5-P1", "grade": "中1", "unit": "Unit5", "code": "Part1", "title": "My Brother in Hawaii｜文也の紹介", "sentences": [{"speaker": "", "text": "This is my brother, Fumiya.", "translation": "こちらは私の兄の文也です。", "meanings": {}}, {"speaker": "", "text": "He's twenty-four years old.", "translation": "彼は24歳です。", "meanings": {}}, {"speaker": "", "text": "He lives in Honolulu, Hawaii.", "translation": "彼はハワイのホノルルに住んでいます。", "meanings": {}}, {"speaker": "", "text": "He works as a tour guide.", "translation": "彼はツアーガイドとして働いています。", "meanings": {}}, {"speaker": "", "text": "He really likes Hawaii.", "translation": "彼はハワイが本当に好きです。", "meanings": {}}, {"speaker": "", "text": "He can speak English very well.", "translation": "彼は英語をとても上手に話せます。", "meanings": {}}, {"speaker": "", "text": "Fumiya studies a lot about Hawaii.", "translation": "文也はハワイについてたくさん勉強しています。", "meanings": {}}, {"speaker": "", "text": "He writes a blog about local food, nature, and beautiful spots.", "translation": "地元の食べ物、自然、美しい場所についてブログを書いています。", "meanings": {}}, {"speaker": "", "text": "I enjoy reading his blog very much.", "translation": "私は彼のブログを読むのをとても楽しんでいます。", "meanings": {}}]}, {"id": "J1-U5-P2", "grade": "中1", "unit": "Unit5", "code": "Part2", "title": "My Brother in Hawaii｜ビーチでの生活", "sentences": [{"speaker": "Riko", "text": "Do you have any questions?", "translation": "何か質問はありますか。", "meanings": {}}, {"speaker": "Eddy", "text": "Yes.", "translation": "はい。", "meanings": {}}, {"speaker": "Eddy", "text": "Does Fumiya live near a beach?", "translation": "文也はビーチの近くに住んでいますか。", "meanings": {}}, {"speaker": "Riko", "text": "Yes, he does.", "translation": "はい、住んでいます。", "meanings": {}}, {"speaker": "Riko", "text": "Hawaii has many beautiful beaches.", "translation": "ハワイには美しいビーチがたくさんあります。", "meanings": {}}, {"speaker": "Eddy", "text": "Does he go to the beach every day?", "translation": "彼は毎日ビーチへ行きますか。", "meanings": {}}, {"speaker": "Riko", "text": "No, he doesn't.", "translation": "いいえ、行きません。", "meanings": {}}, {"speaker": "Riko", "text": "Not every day.", "translation": "毎日ではありません。", "meanings": {}}, {"speaker": "Riko", "text": "He usually goes to the beach on weekends.", "translation": "彼はたいてい週末にビーチへ行きます。", "meanings": {}}, {"speaker": "Eddy", "text": "What does he do there?", "translation": "彼はそこで何をしますか。", "meanings": {}}, {"speaker": "Riko", "text": "He swims and surfs with his friends.", "translation": "友達と泳いだりサーフィンをしたりします。", "meanings": {}}, {"speaker": "Riko", "text": "Sometimes he swims with dolphins.", "translation": "ときどきイルカと泳ぎます。", "meanings": {}}, {"speaker": "Riko", "text": "He really enjoys life in Hawaii.", "translation": "彼はハワイでの生活を本当に楽しんでいます。", "meanings": {}}, {"speaker": "Eddy", "text": "Wow, that's nice!", "translation": "わあ、いいですね！", "meanings": {}}]}, {"id": "J1-U5-RT", "grade": "中1", "unit": "Unit5", "code": "Read and Think", "title": "Life in Hawaii｜Cafe Maria", "sentences": [{"speaker": "", "text": "Cafe Maria is my favorite restaurant in Honolulu.", "translation": "カフェ・マリアはホノルルで私がいちばん好きなレストランです。", "meanings": {}}, {"speaker": "", "text": "The restaurant does not have a website, but it is very popular.", "translation": "そのレストランにはウェブサイトがありませんが、とても人気があります。", "meanings": {}}, {"speaker": "", "text": "Maria is the owner of the restaurant.", "translation": "マリアはそのレストランのオーナーです。", "meanings": {}}, {"speaker": "", "text": "She does not speak Japanese, but she knows a lot about Japan.", "translation": "彼女は日本語を話しませんが、日本についてたくさん知っています。", "meanings": {}}, {"speaker": "", "text": "She is kind and friendly.", "translation": "彼女は親切で人なつっこいです。", "meanings": {}}, {"speaker": "", "text": "My favorite dish there is loco moco.", "translation": "そこで私がいちばん好きな料理はロコモコです。", "meanings": {}}, {"speaker": "", "text": "It is a beef patty and a fried egg on top of rice.", "translation": "それはご飯の上にビーフパティと目玉焼きをのせた料理です。", "meanings": {}}, {"speaker": "", "text": "It is wonderful.", "translation": "とてもすばらしいです。", "meanings": {}}]}, {"id": "U3-0xx", "unit": "Unit3", "code": "0xx", "title": "原爆ドーム・平和ボランティア", "sentences": [{"speaker": "", "text": "This is the Atomic Bomb Dome.", "translation": "これは原爆ドームです。", "meanings": {"This": "これは", "is": "～です", "the": "その", "Atomic": "原子の", "Bomb": "爆弾", "Dome": "ドーム"}}, {"speaker": "", "text": "The world's first atomic bomb was dropped near here at 8:15 a.m. on August 6, 1945.", "translation": "世界で最初の原子爆弾は、1945年8月6日の午前8時15分にこの近くへ投下されました。", "meanings": {"The": "その", "world's": "世界の", "first": "最初の", "atomic": "原子の", "bomb": "爆弾", "was": "～された", "dropped": "投下された", "near": "～の近くに", "here": "ここ", "at": "～に（時刻）", "8:15": "8時15分", "a.m.": "午前", "on": "～に（日付）", "August": "8月", "6": "6日", "1945": "1945年"}}, {"speaker": "", "text": "The dome has been like this for about 80 years.", "translation": "そのドームは約80年間、このような状態のままです。", "meanings": {"The": "その", "dome": "ドーム", "has": "現在完了を作る", "been": "be の過去分詞", "like": "～のような", "this": "このような", "for": "～の間", "about": "約", "80": "80", "years": "年間"}}, {"speaker": "", "text": "It reminds us of the horrors of the atomic bomb.", "translation": "それは私たちに原子爆弾の恐ろしさを思い起こさせます。", "meanings": {"It": "それは", "reminds": "思い出させる", "us": "私たちに", "of": "～を／～について", "the": "その", "horrors": "恐ろしさ・恐怖", "atomic": "原子の", "bomb": "爆弾"}}, {"speaker": "", "text": "It's also a reminder of our mission to work for peace.", "translation": "それはまた、平和のために取り組むという私たちの使命を思い出させるものでもあります。", "meanings": {"It's": "It is の短縮形", "also": "また", "a": "1つの", "reminder": "思い出させるもの", "of": "～についての", "our": "私たちの", "mission": "使命", "to": "～すること", "work": "取り組む", "for": "～のために", "peace": "平和"}}, {"speaker": "Ms. Nishimura", "text": "Does anyone have any questions?", "translation": "何か質問がある人はいますか。", "meanings": {"Does": "疑問文を作る助動詞", "anyone": "誰か", "have": "持っている／ある", "any": "何か", "questions": "質問"}}, {"speaker": "Tina", "text": "How long have you been a peace volunteer?", "translation": "あなたはどのくらいの間、平和活動のボランティアをしているのですか。", "meanings": {"How": "どのくらい", "long": "長く／どのくらいの間", "have": "現在完了を作る", "you": "あなたは", "been": "be の過去分詞", "a": "1人の", "peace": "平和", "volunteer": "ボランティア"}}, {"speaker": "Ms. Nishimura", "text": "I've been a volunteer since 2000.", "translation": "私は2000年からずっとボランティアをしています。", "meanings": {"I've": "I have の短縮形", "been": "be の過去分詞", "a": "1人の", "volunteer": "ボランティア", "since": "～以来／～からずっと", "2000": "2000年"}}, {"speaker": "Tina", "text": "That's a long time!", "translation": "それは長いですね！", "meanings": {"That's": "That is の短縮形", "a": "1つの", "long": "長い", "time": "時間"}}, {"speaker": "Kota", "text": "Why did you become a volunteer?", "translation": "なぜあなたはボランティアになったのですか。", "meanings": {}}, {"speaker": "Nishimura", "text": "When my daughter was a child, she often asked me questions about the peace monuments, but I couldn't answer.", "translation": "娘が子どものころ、平和記念碑についてよく質問されましたが、私は答えることができませんでした。", "meanings": {}}, {"speaker": "Nishimura", "text": "I realized that I didn't know much about the atomic bomb.", "translation": "私は原子爆弾についてあまり知らなかったことに気づきました。", "meanings": {}}, {"speaker": "Nishimura", "text": "So I wanted to learn about the bombing.", "translation": "そこで、その爆撃について学びたいと思いました。", "meanings": {}}, {"speaker": "Nishimura", "text": "I was determined to tell people, especially young people, about these tragic events.", "translation": "私は、特に若い人たちに、これらの悲惨な出来事を伝えようと決心しました。", "meanings": {}}, {"speaker": "Nishimura", "text": "Young people must learn about these events to create a better world.", "translation": "よりよい世界をつくるために、若い人たちはこれらの出来事について学ばなければなりません。", "meanings": {}}, {"speaker": "Tina", "text": "I've been thinking about our trip to Hiroshima.", "translation": "私は広島への旅行についてずっと考えています。", "meanings": {}}, {"speaker": "Kota", "text": "Me, too. What can we do to promote peace in the world?", "translation": "僕もです。世界の平和を促進するために、私たちには何ができるでしょうか。", "meanings": {}}, {"speaker": "", "text": "Our trip to Hiroshima was a valuable experience for me.", "translation": "広島への旅行は、私にとって貴重な経験でした。", "meanings": {}}, {"speaker": "", "text": "Before our trip, our teacher told us what to see in Hiroshima: the Atomic Bomb Dome.", "translation": "旅行の前に、先生は広島で見るものとして原爆ドームを教えてくれました。", "meanings": {}}, {"speaker": "", "text": "There I met a peace volunteer.", "translation": "そこで私は平和活動のボランティアに会いました。", "meanings": {}}, {"speaker": "", "text": "Though she wasn't a victim of the atomic bomb, she learned about the victims.", "translation": "彼女は原子爆弾の被害者ではありませんでしたが、被害者について学んでいました。", "meanings": {}}, {"speaker": "", "text": "The survivors of the atomic bomb are getting older year by year.", "translation": "原子爆弾の生存者たちは年々高齢になっています。", "meanings": {}}, {"speaker": "", "text": "She thinks we should pass their words on to the next generation.", "translation": "彼女は、彼らの言葉を次の世代へ伝えるべきだと考えています。", "meanings": {}}, {"speaker": "", "text": "From her, I learned a lot about the war and the tragic events of August 6, 1945.", "translation": "私は彼女から、戦争と1945年8月6日の悲惨な出来事について多くを学びました。", "meanings": {}}, {"speaker": "", "text": "She showed us how to work for world peace.", "translation": "彼女は私たちに、世界平和のためにどのように取り組むかを示してくれました。", "meanings": {}}, {"speaker": "", "text": "It's important for us to learn about the past and share it with others.", "translation": "私たちにとって、過去について学び、それを他の人と共有することは大切です。", "meanings": {}}], "grade": "中3"}, {"id": "U3-1xx", "unit": "Unit3", "code": "1xx", "title": "Peace can't be built by words alone.", "sentences": [{"speaker": "", "text": "I became a peace volunteer because of my daughter's questions.", "translation": "私は娘の質問がきっかけで平和活動のボランティアになりました。", "meanings": {}}, {"speaker": "", "text": "I was born and raised in Hiroshima, and I learned about the A-bombing at school.", "translation": "私は広島で生まれ育ち、学校で原爆投下について学びました。", "meanings": {}}, {"speaker": "", "text": "However, when my daughter asked me some questions about it, I found that I couldn't answer in my own words.", "translation": "しかし、娘にそれについていくつか質問されたとき、自分の言葉で答えられないことに気づきました。", "meanings": {}}, {"speaker": "", "text": "I decided to learn about the A-bombing of Hiroshima again.", "translation": "私は広島への原爆投下についてもう一度学ぶことに決めました。", "meanings": {}}, {"speaker": "", "text": "I wanted to pass down my own words to younger people, such as my daughter.", "translation": "私は娘のような若い人たちに、自分自身の言葉を伝えていきたいと思いました。", "meanings": {}}, {"speaker": "", "text": "I am not an A-bomb survivor, so at first it was difficult for me to talk about the A-bombing without personal experience.", "translation": "私は被爆者ではないので、初めは自分の体験なしに原爆について話すことは難しかったです。", "meanings": {}}, {"speaker": "", "text": "Then one day, I learned about Mr. Floyd Schmoe.", "translation": "その後ある日、私はフロイド・シュモーさんについて知りました。", "meanings": {}}, {"speaker": "", "text": "He was an American, and he had no A-bomb experience, but he thought of the survivors and felt their pain as his own.", "translation": "彼はアメリカ人で被爆体験はありませんでしたが、被爆者のことを思い、その苦しみを自分のことのように感じました。", "meanings": {}}, {"speaker": "", "text": "He collected money and came to Hiroshima to help A-bomb survivors.", "translation": "彼はお金を集め、被爆者を助けるために広島へ来ました。", "meanings": {}}, {"speaker": "", "text": "His action became a big inspiration for me.", "translation": "彼の行動は私にとって大きな励みになりました。", "meanings": {}}, {"speaker": "", "text": "I have been learning from him and acting as a peace volunteer since then.", "translation": "それ以来、私は彼から学び、平和活動のボランティアとして活動してきました。", "meanings": {}}, {"speaker": "", "text": "I'd like to introduce his words to you — “Peace can't be built by words alone. Action must be taken.”", "translation": "彼の言葉を紹介したいと思います。「平和は言葉だけでは築けない。行動を起こさなければならない。」", "meanings": {}}], "grade": "中3"}, {"id": "U3-2xx", "unit": "Unit3", "code": "2xx", "title": "杉原千畝と命のビザ", "sentences": [{"speaker": "", "text": "On the morning of July 17, 1940, Sugihara Chiune was in his house in Kaunas, Lithuania.", "translation": "1940年7月17日の朝、杉原千畝はリトアニアのカウナスにある自宅にいました。", "meanings": {}}, {"speaker": "", "text": "He looked outside and saw many people around his house.", "translation": "彼は外を見て、自宅の周りに多くの人々がいるのを見ました。", "meanings": {}}, {"speaker": "", "text": "“Who are they?” asked his wife, Yukiko.", "translation": "「あの人たちは誰ですか」と妻の幸子が尋ねました。", "meanings": {}}, {"speaker": "", "text": "“People from Poland. They’re Jewish. They escaped from the Nazis,” he answered.", "translation": "「ポーランドから来た人たちです。ユダヤ人です。ナチスから逃げてきたのです」と彼は答えました。", "meanings": {}}, {"speaker": "", "text": "They asked Sugihara to issue visas.", "translation": "彼らは杉原にビザを発行してほしいと頼みました。", "meanings": {}}, {"speaker": "", "text": "They wanted to go to safe countries.", "translation": "彼らは安全な国へ行きたがっていました。", "meanings": {}}, {"speaker": "", "text": "To get there, they needed to pass through Japan.", "translation": "そこへ行くためには、日本を通過する必要がありました。", "meanings": {}}, {"speaker": "", "text": "“I must help these people,” Sugihara thought.", "translation": "「この人たちを助けなければならない」と杉原は思いました。", "meanings": {}}, {"speaker": "", "text": "The next day, there were more people around his house.", "translation": "翌日、彼の家の周りにはさらに多くの人がいました。", "meanings": {}}, {"speaker": "", "text": "He asked for permission to issue visas, but it was refused by the Foreign Ministry.", "translation": "彼はビザを発行する許可を求めましたが、外務省に拒否されました。", "meanings": {}}, {"speaker": "", "text": "He tried again but received the same answer.", "translation": "彼はもう一度試みましたが、同じ返事を受けました。", "meanings": {}}, {"speaker": "", "text": "After 10 days, Sugihara finally decided to help them.", "translation": "10日後、杉原はついに彼らを助けることを決めました。", "meanings": {}}, {"speaker": "", "text": "He told Yukiko that he was going to issue visas to the people.", "translation": "彼は幸子に、人々にビザを発行するつもりだと伝えました。", "meanings": {}}, {"speaker": "", "text": "Yukiko knew the risks, but she agreed.", "translation": "幸子は危険を分かっていましたが、賛成しました。", "meanings": {}}, {"speaker": "", "text": "“I’ll support you,” she said to him.", "translation": "「あなたを支えます」と彼女は言いました。", "meanings": {}}, {"speaker": "", "text": "On July 29, he said to the people around his house, “You will all get your visas!”", "translation": "7月29日、彼は家の周りの人々に「皆さん全員にビザを出します」と言いました。", "meanings": {}}, {"speaker": "", "text": "There was a short silence, then a big cry of joy.", "translation": "短い沈黙の後、大きな歓声が上がりました。", "meanings": {}}, {"speaker": "", "text": "For the next 30 days, Sugihara wrote visas day and night.", "translation": "その後30日間、杉原は昼夜を問わずビザを書きました。", "meanings": {}}, {"speaker": "", "text": "He saw each family and wrote their names by hand.", "translation": "彼は一つ一つの家族に会い、手書きで名前を書きました。", "meanings": {}}, {"speaker": "", "text": "He smiled and said, “The world is like a big wheel. We’re all connected. We shouldn’t fight each other. We should join hands. Take care and good luck!”", "translation": "彼はほほえんで「世界は大きな車輪のようなものです。私たちはみなつながっています。互いに争うべきではありません。手を取り合いましょう。気をつけて、幸運を」と言いました。", "meanings": {}}, {"speaker": "", "text": "On August 27, he received a telegram from the Ministry, “Close the office now and go to Berlin.”", "translation": "8月27日、彼は外務省から「今すぐ領事館を閉め、ベルリンへ行け」という電報を受け取りました。", "meanings": {}}, {"speaker": "", "text": "On September 4, Sugihara and his family had to leave for Berlin.", "translation": "9月4日、杉原と家族はベルリンへ出発しなければなりませんでした。", "meanings": {}}, {"speaker": "", "text": "Some people followed them to the platform.", "translation": "何人かの人々は彼らをホームまで追ってきました。", "meanings": {}}, {"speaker": "", "text": "He continued to write visas even as he got on the train.", "translation": "彼は列車に乗り込むときでさえビザを書き続けました。", "meanings": {}}, {"speaker": "", "text": "He handed them out through the window.", "translation": "彼は窓からそれらを手渡しました。", "meanings": {}}, {"speaker": "", "text": "The bell rang and the train started to move.", "translation": "ベルが鳴り、列車が動き始めました。", "meanings": {}}, {"speaker": "", "text": "With tears in his eyes, Sugihara said, “I cannot write anymore. Forgive me. I will pray for your safety.”", "translation": "目に涙を浮かべながら、杉原は「もう書けません。許してください。皆さんの無事を祈ります」と言いました。", "meanings": {}}, {"speaker": "", "text": "One of them cried, “Thank you, Mr. Sugihara. We will never forget you.”", "translation": "そのうちの一人が「ありがとう、杉原さん。私たちは決してあなたを忘れません」と叫びました。", "meanings": {}}, {"speaker": "", "text": "The war ended in 1945.", "translation": "戦争は1945年に終わりました。", "meanings": {}}, {"speaker": "", "text": "Sugihara returned to Japan and started working as a trader.", "translation": "杉原は日本に戻り、貿易業者として働き始めました。", "meanings": {}}, {"speaker": "", "text": "Years later, in 1968, he received a phone call.", "translation": "何年も後の1968年、彼は一本の電話を受けました。", "meanings": {}}, {"speaker": "", "text": "It was from Mr. Nishri, an Israeli diplomat.", "translation": "それはイスラエルの外交官、ニシュリさんからでした。", "meanings": {}}, {"speaker": "", "text": "Mr. Nishri met Sugihara and took out an old piece of paper.", "translation": "ニシュリさんは杉原に会い、一枚の古い紙を取り出しました。", "meanings": {}}, {"speaker": "", "text": "It was a Sugihara visa.", "translation": "それは杉原が発行したビザでした。", "meanings": {}}, {"speaker": "", "text": "“You won’t remember me, but I have never forgotten you,” he said.", "translation": "「あなたは私を覚えていないでしょう。でも私はあなたを決して忘れたことがありません」と彼は言いました。", "meanings": {}}, {"speaker": "", "text": "Sugihara issued 2,139 visas to Jewish people in Lithuania.", "translation": "杉原はリトアニアでユダヤ人に2,139通のビザを発行しました。", "meanings": {}}, {"speaker": "", "text": "His actions saved more than 6,000 lives in total.", "translation": "彼の行動は合計6,000人以上の命を救いました。", "meanings": {}}], "grade": "中3"}, {"id": "U3-3xx", "unit": "Unit3", "code": "3xx", "title": "My Opinion: School Uniforms / Nap Time", "sentences": [{"speaker": "", "text": "Hi. I’m Tamara.", "translation": "こんにちは。私はタマラです。", "meanings": {}}, {"speaker": "", "text": "I’m a junior high school student in the U.S.", "translation": "私はアメリカの中学生です。", "meanings": {}}, {"speaker": "", "text": "I’ve seen Japanese school uniforms on the internet.", "translation": "私はインターネットで日本の学校制服を見たことがあります。", "meanings": {}}, {"speaker": "", "text": "They’re really cute!", "translation": "それらは本当にかわいいです。", "meanings": {}}, {"speaker": "", "text": "I want a uniform like that for my school life.", "translation": "学校生活でそのような制服が欲しいです。", "meanings": {}}, {"speaker": "", "text": "They’re convenient to wear every day.", "translation": "それらは毎日着るのに便利です。", "meanings": {}}, {"speaker": "", "text": "They save time, too.", "translation": "時間の節約にもなります。", "meanings": {}}, {"speaker": "", "text": "Sometimes I like to choose my own clothes, but I think it’s better for all of us to wear uniforms at school.", "translation": "自分の服を選びたいときもありますが、学校ではみんなが制服を着るほうがよいと思います。", "meanings": {}}, {"speaker": "", "text": "It’s an attractive idea.", "translation": "それは魅力的な考えです。", "meanings": {}}, {"speaker": "", "text": "What do you think?", "translation": "あなたはどう思いますか。", "meanings": {}}, {"speaker": "", "text": "Hi. I’m Koji.", "translation": "こんにちは。僕はコウジです。", "meanings": {}}, {"speaker": "", "text": "I moved to Taiwan when I was ten years old.", "translation": "私は10歳のときに台湾へ引っ越しました。", "meanings": {}}, {"speaker": "", "text": "I’ve been here since then.", "translation": "それ以来ずっとここにいます。", "meanings": {}}, {"speaker": "", "text": "I’ve found some differences between schools in Taiwan and schools in Japan.", "translation": "台湾の学校と日本の学校の間にいくつか違いがあることに気づきました。", "meanings": {}}, {"speaker": "", "text": "For example, in Taiwan, the students have a short sleep after lunch.", "translation": "例えば台湾では、生徒たちは昼食後に短い睡眠をとります。", "meanings": {}}, {"speaker": "", "text": "They have to sleep about 15 to 20 minutes at their desk.", "translation": "彼らは机で約15～20分眠らなければなりません。", "meanings": {}}, {"speaker": "", "text": "It’s called “nap time.”", "translation": "それは「昼寝の時間」と呼ばれています。", "meanings": {}}, {"speaker": "", "text": "Our teacher tells us that nap time is important because it’s really good for our health.", "translation": "先生は、昼寝は健康にとてもよいので大切だと私たちに言います。", "meanings": {}}, {"speaker": "", "text": "I agree with him.", "translation": "私は先生に賛成です。", "meanings": {}}, {"speaker": "", "text": "Nap time helps me relax.", "translation": "昼寝の時間は私がリラックスするのに役立ちます。", "meanings": {}}, {"speaker": "", "text": "I think Japanese students should have nap time after lunch, too.", "translation": "日本の生徒も昼食後に昼寝の時間を持つべきだと思います。", "meanings": {}}, {"speaker": "", "text": "However, some of my friends are against nap time because they want to play sports, read books, or use the internet.", "translation": "しかし、友達の中にはスポーツをしたり、本を読んだり、インターネットを使ったりしたいので昼寝に反対する人もいます。", "meanings": {}}, {"speaker": "", "text": "They think they don’t need nap time.", "translation": "彼らは昼寝の時間は必要ないと考えています。", "meanings": {}}, {"speaker": "", "text": "What do you think?", "translation": "あなたはどう思いますか。", "meanings": {}}], "grade": "中3"}, {"id": "U4-0xx", "unit": "Unit4", "code": "0xx", "title": "AI Technology", "sentences": [{"speaker": "", "text": "AI technology has made great progress lately.", "translation": "AI技術は最近、大きく進歩しています。", "meanings": {}}, {"speaker": "", "text": "It has become a part of our daily lives.", "translation": "それは私たちの日常生活の一部になっています。", "meanings": {}}, {"speaker": "", "text": "For example, internet search engines use AI technology.", "translation": "例えば、インターネットの検索エンジンはAI技術を使っています。", "meanings": {}}, {"speaker": "", "text": "Smartphones which respond to voice commands are common these days.", "translation": "音声指示に反応するスマートフォンは最近では一般的です。", "meanings": {}}, {"speaker": "", "text": "Robots which automatically clean your house have become popular.", "translation": "家を自動で掃除するロボットも人気になっています。", "meanings": {}}, {"speaker": "", "text": "These all use AI technology.", "translation": "これらはすべてAI技術を使っています。", "meanings": {}}, {"speaker": "", "text": "Translation software also uses AI technology.", "translation": "翻訳ソフトもAI技術を使っています。", "meanings": {}}, {"speaker": "", "text": "It can come up with the best translation by using AI technology.", "translation": "AI技術を使って最適な翻訳を考え出すことができます。", "meanings": {}}, {"speaker": "", "text": "It is becoming common.", "translation": "それは一般的になりつつあります。", "meanings": {}}, {"speaker": "", "text": "In the near future, AI will help us communicate with people all over the world quite easily.", "translation": "近い将来、AIは私たちが世界中の人々とかなり簡単に意思疎通するのを助けてくれるでしょう。", "meanings": {}}, {"speaker": "Ms. Thusi", "text": "Today’s discussion topic is AI technology for our future.", "translation": "今日の話し合いのテーマは、私たちの未来のためのAI技術です。", "meanings": {}}, {"speaker": "Ms. Thusi", "text": "If you can use translation software, do you still need to learn foreign languages in school?", "translation": "翻訳ソフトを使えるなら、学校で外国語を学ぶ必要はまだありますか。", "meanings": {}}, {"speaker": "Kota", "text": "I think translation software is very useful.", "translation": "翻訳ソフトはとても役に立つと思います。", "meanings": {}}, {"speaker": "Kota", "text": "I have an uncle who runs a Japanese restaurant.", "translation": "私には日本料理店を経営している叔父がいます。", "meanings": {}}, {"speaker": "Kota", "text": "He’s not good at speaking English, so he uses a translation device to communicate with foreign customers.", "translation": "彼は英語を話すのが得意ではないので、外国人の客と意思疎通するために翻訳機を使っています。", "meanings": {}}, {"speaker": "Kota", "text": "In my opinion, AI devices can help with many languages, so learning foreign languages will not be so important anymore.", "translation": "私の考えでは、AI機器はいろいろな言語を助けられるので、外国語を学ぶことはそれほど重要ではなくなるでしょう。", "meanings": {}}, {"speaker": "Hajin", "text": "Kota has a good point, but I think learning foreign languages is still important.", "translation": "コウタはよい点を指摘していますが、外国語を学ぶことはまだ大切だと思います。", "meanings": {}}, {"speaker": "Hajin", "text": "I don’t always want to rely on a machine to communicate with people.", "translation": "私は人と意思疎通するのにいつも機械に頼りたいとは思いません。", "meanings": {}}, {"speaker": "Eri", "text": "Can I say something?", "translation": "何か言ってもいいですか。", "meanings": {}}, {"speaker": "Tina", "text": "Go ahead, Eri.", "translation": "どうぞ、エリ。", "meanings": {}}, {"speaker": "Eri", "text": "I think I agree with Hajin.", "translation": "私はハジンに賛成だと思います。", "meanings": {}}, {"speaker": "Eri", "text": "I also enjoy communicating in English, so I want to study more.", "translation": "私は英語で意思疎通することも楽しんでいるので、もっと勉強したいです。", "meanings": {}}, {"speaker": "Eri", "text": "How about you, Tina?", "translation": "あなたはどうですか、ティナ。", "meanings": {}}, {"speaker": "Tina", "text": "I think Kota is right.", "translation": "コウタが正しいと思います。", "meanings": {}}, {"speaker": "Tina", "text": "Like his uncle, we’ll use AI devices more, and that’ll be convenient for us.", "translation": "彼の叔父のように、私たちはAI機器をもっと使うようになり、それは便利でしょう。", "meanings": {}}, {"speaker": "Tina", "text": "On the other hand, I also agree with Hajin and Eri’s opinion.", "translation": "一方で、私はハジンとエリの意見にも賛成です。", "meanings": {}}, {"speaker": "Tina", "text": "Learning a language is a valuable experience that will help us broaden our world view.", "translation": "言語を学ぶことは、私たちの世界観を広げるのに役立つ貴重な経験です。", "meanings": {}}, {"speaker": "Tina", "text": "Learning each other’s language and culture helps us get a better understanding of each other, too.", "translation": "お互いの言語と文化を学ぶことは、お互いをよりよく理解する助けにもなります。", "meanings": {}}, {"speaker": "Thusi", "text": "OK, I think everyone had valuable opinions to share.", "translation": "では、みなさん共有する価値のある意見を持っていたと思います。", "meanings": {}}, {"speaker": "Thusi", "text": "Thank you for sharing them.", "translation": "それらを共有してくれてありがとう。", "meanings": {}}], "grade": "中3"}, {"id": "U4-1xx", "unit": "Unit4", "code": "1xx", "title": "Opinions about Learning Foreign Languages", "sentences": [{"speaker": "Ms. Cat", "text": "We should still learn foreign languages to speak directly with people from other countries.", "translation": "私たちは他の国の人々と直接話すために、これからも外国語を学ぶべきです。", "meanings": {}}, {"speaker": "Ms. Cat", "text": "I think it helps us understand each other better.", "translation": "それは私たちがお互いをよりよく理解する助けになると思います。", "meanings": {}}, {"speaker": "Ms. Cat", "text": "I would hate to be someone who always depends on machines.", "translation": "いつも機械に頼る人にはなりたくありません。", "meanings": {}}, {"speaker": "Mr. Panda", "text": "We students don’t need to learn foreign languages anymore.", "translation": "私たち生徒はもう外国語を学ぶ必要はありません。", "meanings": {}}, {"speaker": "Mr. Panda", "text": "First, now we can communicate with AI tools which translate various languages.", "translation": "第一に、今ではさまざまな言語を翻訳するAIツールで意思疎通できます。", "meanings": {}}, {"speaker": "Mr. Panda", "text": "Second, there are already too many things for us to learn.", "translation": "第二に、私たちにはすでに学ぶことが多すぎます。", "meanings": {}}, {"speaker": "Mr. Panda", "text": "Learning English takes too much time.", "translation": "英語を学ぶことは時間がかかりすぎます。", "meanings": {}}, {"speaker": "Mr. Panda", "text": "In my country, students need more free time.", "translation": "私の国では、生徒にはもっと自由時間が必要です。", "meanings": {}}, {"speaker": "Mr. Robo", "text": "I’ve been learning English for five years.", "translation": "私は5年間英語を学んできました。", "meanings": {}}, {"speaker": "Mr. Robo", "text": "It’s a valuable experience for me because it made me more positive toward people who have different cultures.", "translation": "異なる文化を持つ人々に対して、より前向きになれたので、それは私にとって貴重な経験です。", "meanings": {}}, {"speaker": "Mr. Robo", "text": "On the other hand, I’m not sure it’s necessary for everyone.", "translation": "一方で、それが全員に必要かどうかは分かりません。", "meanings": {}}, {"speaker": "Mr. Robo", "text": "Not all of us are interested in learning languages.", "translation": "私たち全員が言語学習に興味があるわけではありません。", "meanings": {}}, {"speaker": "Mr. Robo", "text": "Sometimes it may be better for us to enjoy speaking with AI tools.", "translation": "ときにはAIツールと話すことを楽しむほうがよいかもしれません。", "meanings": {}}, {"speaker": "Ms. Ninja", "text": "Learning foreign languages is not just for communication.", "translation": "外国語を学ぶことは、単に意思疎通のためだけではありません。", "meanings": {}}, {"speaker": "Ms. Ninja", "text": "It helps us understand our own language and culture better, so we should keep learning them.", "translation": "それは自分たちの言語と文化をよりよく理解する助けになるので、学び続けるべきです。", "meanings": {}}, {"speaker": "Ms. Ninja", "text": "I remember the famous words of Goethe: “Those who know nothing of foreign languages know nothing of their own.”", "translation": "ゲーテの有名な言葉を覚えています。「外国語を何も知らない人は、自分の言語についても何も知らない。」", "meanings": {}}], "grade": "中3"}, {"id": "U4-2xx", "unit": "Unit4", "code": "2xx", "title": "Robots: HAL / OriHime / Sociable Trash Box", "sentences": [{"speaker": "", "text": "When you hear the word “robot,” what kind of robot do you imagine?", "translation": "「ロボット」という言葉を聞くと、どんなロボットを想像しますか。", "meanings": {}}, {"speaker": "", "text": "Some people think of anime characters, some people think of human-like robots that talk to people, and some people think of home cleaning robots.", "translation": "アニメのキャラクターを思い浮かべる人もいれば、人と話す人型ロボットや家庭用掃除ロボットを思い浮かべる人もいます。", "meanings": {}}, {"speaker": "", "text": "Scientists are continuing to invent more and more robots.", "translation": "科学者たちはますます多くのロボットを発明し続けています。", "meanings": {}}, {"speaker": "", "text": "What kind of robots have they created?", "translation": "彼らはどのようなロボットを作ってきたのでしょうか。", "meanings": {}}, {"speaker": "", "text": "Let’s look at some examples and think about the relationship between humans and robots.", "translation": "いくつかの例を見て、人間とロボットの関係について考えてみましょう。", "meanings": {}}, {"speaker": "", "text": "This is “HAL,” a robot suit.", "translation": "これはロボットスーツ「HAL」です。", "meanings": {}}, {"speaker": "", "text": "It’s a cyborg-type robot.", "translation": "それはサイボーグ型のロボットです。", "meanings": {}}, {"speaker": "", "text": "HAL doesn’t do anything by itself, but it helps people carry heavy things and protects them from injury.", "translation": "HALはそれ自体では何もしませんが、人が重い物を運ぶのを助け、けがから守ります。", "meanings": {}}, {"speaker": "", "text": "HAL is used in care facilities.", "translation": "HALは介護施設で使われています。", "meanings": {}}, {"speaker": "", "text": "It supports people who work there.", "translation": "そこで働く人々を支えます。", "meanings": {}}, {"speaker": "", "text": "It helps them transfer elderly people.", "translation": "高齢者を移動させるのを助けます。", "meanings": {}}, {"speaker": "", "text": "Elderly people can use HAL, too.", "translation": "高齢者自身もHALを使うことができます。", "meanings": {}}, {"speaker": "", "text": "It helps them move their body.", "translation": "体を動かすのを助けます。", "meanings": {}}, {"speaker": "", "text": "In addition, it improves and maintains their physical functions.", "translation": "さらに、身体機能を改善し維持します。", "meanings": {}}, {"speaker": "", "text": "HAL can widen our possibilities.", "translation": "HALは私たちの可能性を広げることができます。", "meanings": {}}, {"speaker": "", "text": "OriHime is an “avatar” robot.", "translation": "OriHimeは「アバター」ロボットです。", "meanings": {}}, {"speaker": "", "text": "Avatar means something that represents you in the virtual world.", "translation": "アバターとは、仮想世界で自分を表すものを意味します。", "meanings": {}}, {"speaker": "", "text": "This robot can represent you and communicate with people in the real world.", "translation": "このロボットはあなたの代わりとなり、現実世界の人々と意思疎通できます。", "meanings": {}}, {"speaker": "", "text": "One of the first OriHime users was Mr. Nagahiro Masato.", "translation": "OriHimeの初期ユーザーの一人は長廣雅人さんでした。", "meanings": {}}, {"speaker": "", "text": "He was a 25-year-old man who had a serious illness.", "translation": "彼は重い病気を抱えた25歳の男性でした。", "meanings": {}}, {"speaker": "", "text": "He didn’t have a job before because he could not move his body.", "translation": "体を動かせなかったため、それまでは仕事を持っていませんでした。", "meanings": {}}, {"speaker": "", "text": "Then OriHime let him work at a cafe.", "translation": "その後、OriHimeによって彼はカフェで働けるようになりました。", "meanings": {}}, {"speaker": "", "text": "OriHime worked as his avatar.", "translation": "OriHimeは彼のアバターとして働きました。", "meanings": {}}, {"speaker": "", "text": "Mr. Nagahiro controlled the robot with small movements of his fingers at home.", "translation": "長廣さんは自宅から指の小さな動きでロボットを操作しました。", "meanings": {}}, {"speaker": "", "text": "He watched a live video that was sent from the robot’s eyes, and he talked through a microphone.", "translation": "彼はロボットの目から送られるライブ映像を見て、マイクを通して話しました。", "meanings": {}}, {"speaker": "", "text": "That way, he was able to serve customers who came to the cafe.", "translation": "その方法で、彼はカフェに来た客に接客することができました。", "meanings": {}}, {"speaker": "", "text": "Thanks to OriHime, he will be able to try new things in the future.", "translation": "OriHimeのおかげで、彼は将来新しいことに挑戦できるでしょう。", "meanings": {}}, {"speaker": "", "text": "Now, look at this picture.", "translation": "では、この写真を見てください。", "meanings": {}}, {"speaker": "", "text": "This robot is called Sociable Trash Box.", "translation": "このロボットは「Sociable Trash Box」と呼ばれています。", "meanings": {}}, {"speaker": "", "text": "What does it do? Can you guess?", "translation": "それは何をするのでしょうか。分かりますか。", "meanings": {}}, {"speaker": "", "text": "This robot finds trash on the floor, but it can’t pick it up.", "translation": "このロボットは床のごみを見つけますが、自分で拾うことはできません。", "meanings": {}}, {"speaker": "", "text": "This robot needs somebody to help it.", "translation": "このロボットには助けてくれる誰かが必要です。", "meanings": {}}, {"speaker": "", "text": "You may think it is useless or helpless, but you will notice something interesting.", "translation": "役に立たない、どうしようもないと思うかもしれませんが、面白いことに気づくでしょう。", "meanings": {}}, {"speaker": "", "text": "When this robot calls for help, people come to it and pick up the trash happily.", "translation": "このロボットが助けを求めると、人々が来て楽しそうにごみを拾います。", "meanings": {}}, {"speaker": "", "text": "They enjoy helping the robot.", "translation": "彼らはロボットを助けることを楽しみます。", "meanings": {}}, {"speaker": "", "text": "It makes people smile.", "translation": "それは人々を笑顔にします。", "meanings": {}}, {"speaker": "", "text": "The person who developed this robot wanted people to recognize the value of cooperation.", "translation": "このロボットを開発した人は、人々に協力の価値を認識してほしいと考えました。", "meanings": {}}, {"speaker": "", "text": "We may expect robots to be perfect, but Sociable Trash Box is made to be imperfect.", "translation": "私たちはロボットに完璧さを期待するかもしれませんが、このロボットは不完全になるよう作られています。", "meanings": {}}, {"speaker": "", "text": "When people help it, they understand the importance of being imperfect and the need to help each other.", "translation": "人々がそれを助けると、不完全であることの大切さと、お互いに助け合う必要性を理解します。", "meanings": {}}, {"speaker": "", "text": "What kind of robot would you like to have?", "translation": "あなたはどんなロボットを持ちたいですか。", "meanings": {}}, {"speaker": "", "text": "What kind of relationships do you want to have with robots?", "translation": "ロボットとどのような関係を持ちたいですか。", "meanings": {}}, {"speaker": "", "text": "Do you think it is okay if robots are imperfect?", "translation": "ロボットが不完全でもよいと思いますか。", "meanings": {}}, {"speaker": "", "text": "They might help us learn to cooperate and be kind to others.", "translation": "ロボットは、私たちが協力することや他人に親切にすることを学ぶ助けになるかもしれません。", "meanings": {}}, {"speaker": "", "text": "We are already living with robots, so it is important and fun to think about these questions.", "translation": "私たちはすでにロボットと共に暮らしているので、これらの問いについて考えることは大切で楽しいことです。", "meanings": {}}], "grade": "中3"}, {"id": "U4-3xx", "unit": "Unit4", "code": "3xx", "title": "Candy Apples", "sentences": [{"speaker": "", "text": "You will need 12 apples, 12 sticks, 3 cups of sugar, a half cup of corn syrup, 1 cup of water, toppings, and red food coloring.", "translation": "リンゴ12個、棒12本、砂糖3カップ、コーンシロップ半カップ、水1カップ、トッピング、赤い食用色素が必要です。", "meanings": {}}, {"speaker": "", "text": "Wash the apples and remove the stems.", "translation": "リンゴを洗い、へたを取り除きます。", "meanings": {}}, {"speaker": "", "text": "Insert the sticks into the stem end of the apples.", "translation": "リンゴのへた側に棒を差し込みます。", "meanings": {}}, {"speaker": "", "text": "Make the sugar syrup: stir the sugar, corn syrup, and water together in a pot or a deep pan.", "translation": "砂糖シロップを作ります。砂糖、コーンシロップ、水を鍋または深いフライパンで一緒に混ぜます。", "meanings": {}}, {"speaker": "", "text": "Boil the sugar syrup until it becomes thick.", "translation": "砂糖シロップが濃くなるまで煮立てます。", "meanings": {}}, {"speaker": "", "text": "Color by adding a few drops of food coloring.", "translation": "食用色素を数滴加えて色をつけます。", "meanings": {}}, {"speaker": "", "text": "Dip the apples in the sugar syrup.", "translation": "リンゴを砂糖シロップに浸します。", "meanings": {}}, {"speaker": "", "text": "Roll the apples in the toppings and cool the apples on a baking sheet.", "translation": "リンゴをトッピングの上で転がし、オーブンシートの上で冷まします。", "meanings": {}}], "grade": "中3"}];const VOCAB={"good": "良い", "mor let grade='中1',storyIndex=0,sentenceIndex=0,recognition=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalize(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' -]+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){return normalize(s).split(' ').filter(Boolean)}
function visibleStories(){return STORIES.filter(x=>x.grade===grade)}
function getMeaning(word,d){const n=normalize(word);if(d.meanings){const k=Object.keys(d.meanings).find(x=>normalize(x)===n);if(k)return d.meanings[k]}return VOCAB[n]||'この語の意味はまだ個別登録されていません。'}
function scoreSpeech(target,heard){const a=tokens(target),b=tokens(heard);const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c)}const score=Math.max(0,Math.round((1-dp[a.length][b.length]/Math.max(a.length,b.length,1))*100));const bs=new Set(b);return{score,checks:a.map(w=>[w,bs.has(w)])}}
function render(){
 const list=visibleStories(); if(storyIndex>=list.length)storyIndex=0; const st=list[storyIndex]; if(sentenceIndex>=st.sentences.length)sentenceIndex=0; const d=st.sentences[sentenceIndex];

 document.getElementById('sentenceSelect').innerHTML=st.sentences.map((x,i)=>`<option value="${i}" ${i===sentenceIndex?'selected':''}>${i+1}. ${x.speaker?x.speaker+'：':''}${x.text.slice(0,34)}${x.text.length>34?'…':''}</option>`).join('');

 const words=parts.map(tok=>{const clean=tok.replace(/[.,!?“”"():;—]/g,'');return /^[A-Za-z0-9]/.test(clean)?`<button class="word" data-word="${esc(clean)}">${esc(tok)}</button>`:esc(tok)}).join(' ');
 document.getElementById('main').innerHTML=`<div class="card"><div class="story">${grade}｜${st.unit} ${st.code}｜${esc(st.title)}</div><div class="meta">${d.speaker?esc(d.speaker)+'：':''}文 ${sentenceIndex+1} / ${st.sentences.length}</div><div class="sentence">${words}</div><div class="meaning" id="meaningBox"></div><div class="actions"><button id="translateBtn">日本語訳を表示</button><button class="speak" id="speakBtn">🔊 読み上げ</button><button class="record" id="startBtn">🎤 音読して評価</button><button class="stop" id="stopBtn" disabled>■ 停止</button></div><div class="translation" id="translationBox">${esc(d.translation)}</div><div id="result"></div></div>`;
 document.querySelectorAll('.word').forEach(b=>b.onclick=()=>{const box=document.getElementById('meaningBox');box.style.display='block';box.innerHTML=`<b>${esc(b.dataset.word)}</b>：${esc(getMeaning(b.dataset.word,d))}`});

 document.getElementById('speakBtn').onclick=speakCurrent;document.getElementById('startBtn').onclick=startRecognition;document.getElementById('stopBtn').onclick=()=>recognition&&recognition.stop();
}
function speakCurrent(){
 const d=visibleStories()[storyIndex].sentences[sentenceIndex];
 if(!('speechSynthesis' in window)){document.getElementById('result').innerHTML='<div class="result bad">この端末では読み上げに対応していません。</div>';return}

 const btn=document.getElementById('speakBtn');btn.disabled=true;btn.textContent='🔊 読み上げ中…';
 u.onend=()=>{btn.disabled=false;btn.textContent='🔊 読み上げ'};u.onerror=()=>{btn.disabled=false;btn.textContent='🔊 読み上げ'};speechSynthesis.speak(u);
}
function startRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('result').innerHTML='<div class="result bad">このブラウザでは音声認識が使えません。</div>';return}

 recognition.onstart=()=>{document.getElementById('startBtn').disabled=true;document.getElementById('stopBtn').disabled=false;document.getElementById('result').innerHTML='<div class="result">🎤 聞き取り中です…</div>'};
 recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';finalText=t.trim();document.getElementById('result').innerHTML=`<div class="result">聞き取り：${esc(finalText)}</div>`};

 recognition.onend=()=>{document.getElementById('startBtn').disabled=false;document.getElementById('stopBtn').disabled=true;if(finalText)showScore(d.text,finalText)};recognition.start();
}
function showScore(target,heard){const r=scoreSpeech(target,heard),cls=r.score>=85?'good':r.score<65?'bad':'';document.getElementById('result').innerHTML=`<div class="result"><div class="score ${cls}">一致度 ${r.score}点</div><div><b>聞き取った英文：</b>${esc(heard)}</div><div class="wordcheck">${r.checks.map(([w,ok])=>`<span class="${ok?'ok':'ng'}">${ok?'✓':'△'} ${esc(w)}</span>`).join('')}</div></div>`}

document.getElementById('nextBtn').onclick=()=>{const list=visibleStories();sentenceIndex++;if(sentenceIndex>=list[storyIndex].sentences.length){storyIndex=(storyIndex+1)%list.length;sentenceIndex=0}render()};
