.userbar{grid-template-columns:1fr auto auto;margin-bottom:11px}.filters{grid-template-columns:repeat(4,1fr);margin-bottom:9px}.tools{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.freqbar{grid-template-columns:1fr 1fr;margin-bottom:10px}

.primary{background:var(--blueSoft);border-color:#a9c8ff}.danger{background:var(--redSoft);border-color:#f4b7b7;color:#941b1b}.success{background:var(--greenSoft);border-color:#a9ddca;color:#075f43}.active{outline:3px solid rgba(37,99,235,.15);border-color:#7caafc}

const USERS_KEY='english_vocab_users_v1', ACTIVE_KEY='english_vocab_active_v1', STATE_PREFIX='english_vocab_state_v1_';

function makeCards(){
  const out=[];
  WORDS.forEach(w=>{
    out.push({id:w.id+'_ej',wordId:w.id,dir:'ej',grade:w.grade,range:w.range,rangeLabel:w.rangeLabel,set:w.set||null,seq:w.seq,q:w.en,a:w.ja,en:w.en,ja:w.ja,note:w.source_note||'',sourceNo:w.sourceNo||null});
    out.push({id:w.id+'_je',wordId:w.id,dir:'je',grade:w.grade,range:w.range,rangeLabel:w.rangeLabel,set:w.set||null,seq:w.seq,q:w.ja,a:w.en,en:w.en,ja:w.ja,note:w.source_note||'',sourceNo:w.sourceNo||null});
  }); return out;
}
const CARDS=makeCards();
function freshState(){return {grade:'3',direction:'ej',range:'all',weakOnly:false,hardOnly:false,freqMin:0,weakIds:[],weakCounts:{},hardIds:[],learnedIds:[],order:[],index:0,showAnswer:false,showStats:false}}
let state=freshState(),users=[],activeUserId='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function userKey(id){return STATE_PREFIX+id} function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(users))} function save(){if(activeUserId)localStorage.setItem(userKey(activeUserId),JSON.stringify(state))}
function loadUsers(){try{users=JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch(e){users=[]}if(!Array.isArray(users)||!users.length){const id='u_'+Date.now();users=[{id,name:'ユーザー1'}];saveUsers();localStorage.setItem(ACTIVE_KEY,id)}const saved=localStorage.getItem(ACTIVE_KEY);activeUserId=users.some(u=>u.id===saved)?saved:users[0].id}
function loadState(){
  state=freshState(); let saved=null;
  try{saved=JSON.parse(localStorage.getItem(userKey(activeUserId))||'null');if(saved)Object.assign(state,saved)}catch(e){}
  if(saved && !('grade' in saved)) state.grade='3';
  if(saved && !('range' in saved) && 'set' in saved) state.range=(saved.set==='all'?'all':'set'+saved.set);
  if(!state.weakCounts||typeof state.weakCounts!=='object')state.weakCounts={};
  (state.weakIds||[]).forEach(id=>{if(!state.weakCounts[id])state.weakCounts[id]=1});
  if(!Array.isArray(state.hardIds))state.hardIds=[];state.hardOnly=!!state.hardOnly;
  state.freqMin=Number(state.freqMin||0);state.showStats=!!state.showStats;
}

function switchUser(id){save();activeUserId=id;localStorage.setItem(ACTIVE_KEY,id);loadState();renderUsers();render()}
function addUser(){const name=(prompt('ユーザー名を入力してください')||'').trim();if(!name)return;const id='u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);users.push({id,name:name.slice(0,30)});saveUsers();localStorage.setItem(userKey(id),JSON.stringify(freshState()));switchUser(id)}

function weakTimes(id){return Number((state.weakCounts||{})[id]||0)}

function rangesForGrade(){
  if(state.grade==='1') return [
    ['all','全範囲'],
    ['u12a','Unit1〜2①（1〜20）'],
    ['u12b','Unit1〜2②（21〜40）'],
    ['u12c','Unit1〜2③（41〜60）'],
    ['u12d','Unit1〜2④（61〜83）'],
    ['u34a','Unit3〜4①（1〜20）'],
    ['u34b','Unit3〜4②（21〜40）'],
    ['u34c','Unit3〜4③（41〜60）'],
    ['u34d','Unit3〜4④（61〜80）'],
    ['u34e','Unit3〜4⑤（81〜100）']
  ];
  return [['all','全22セット'],...Array.from({length:22},(_,i)=>['set'+(i+1),'セット'+(i+1)])];
}
function updateRangeOptions(){
  const sel=document.getElementById('rangeSel'), opts=rangesForGrade();
  if(!opts.some(x=>x[0]===state.range)) state.range='all';
  sel.innerHTML=opts.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
  sel.value=state.range;
}
function baseCards(){
  return CARDS.filter(c=>{
    if(String(c.grade)!==state.grade) return false;
    if(!(state.direction==='both'||c.dir===state.direction)) return false;
    if(state.range==='all') return true;

    if(state.grade==='1'){
      const n=c.seq;
      if(state.range==='u12a') return c.range==='u12' && n>=1 && n<=20;
      if(state.range==='u12b') return c.range==='u12' && n>=21 && n<=40;
      if(state.range==='u12c') return c.range==='u12' && n>=41 && n<=60;
      if(state.range==='u12d') return c.range==='u12' && n>=61 && n<=83;

      // Unit3〜4 は中1データ全体の seq 84〜183 なので、表示上の 1〜100 に対応させる。
      const u34n=n-83;
      if(state.range==='u34a') return c.range==='u34' && u34n>=1 && u34n<=20;
      if(state.range==='u34b') return c.range==='u34' && u34n>=21 && u34n<=40;
      if(state.range==='u34c') return c.range==='u34' && u34n>=41 && u34n<=60;
      if(state.range==='u34d') return c.range==='u34' && u34n>=61 && u34n<=80;
      if(state.range==='u34e') return c.range==='u34' && u34n>=81 && u34n<=100;
      return false;
    }

    return c.range===state.range;
  });
}
function filteredCards(){
  let base=baseCards(); if(state.weakOnly){const w=new Set(state.weakIds);base=base.filter(c=>w.has(c.id))}
  if(state.hardOnly){const h=new Set(state.hardIds);base=base.filter(c=>h.has(c.id))}
  if(state.freqMin>0)base=base.filter(c=>weakTimes(c.id)>=state.freqMin).sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.seq-b.seq||(a.dir==='ej'?-1:1));
  return base;
}
function sourceOrder(cards){return cards.slice().sort((a,b)=>a.seq-b.seq||(a.dir==='ej'?-1:1))}
function ensureOrder(){const base=filteredCards(),valid=new Set(base.map(c=>c.id));let ids=(Array.isArray(state.order)?state.order:[]).filter(id=>valid.has(id));sourceOrder(base).forEach(c=>{if(!ids.includes(c.id))ids.push(c.id)});state.order=ids;if(state.index>=ids.length)state.index=0;if(state.index<0)state.index=0}
function current(){ensureOrder();if(!state.order.length)return null;return CARDS.find(c=>c.id===state.order[state.index])||null}
function next(){ensureOrder();if(!state.order.length)return;state.index=(state.index+1)%state.order.length;state.showAnswer=false;save();render()}
function prev(){ensureOrder();if(!state.order.length)return;state.index=(state.index-1+state.order.length)%state.order.length;state.showAnswer=false;save();render()}
function markWeak(){const c=current();if(!c)return;state.weakCounts[c.id]=weakTimes(c.id)+1;if(!state.weakIds.includes(c.id))state.weakIds.push(c.id);state.learnedIds=state.learnedIds.filter(id=>id!==c.id);next()}
function toggleHard(){const c=current();if(!c)return;if(state.hardIds.includes(c.id))state.hardIds=state.hardIds.filter(id=>id!==c.id);else state.hardIds.push(c.id);save();render()}
function markLearned(){const c=current();if(!c)return;if(!state.learnedIds.includes(c.id))state.learnedIds.push(c.id);state.weakIds=state.weakIds.filter(id=>id!==c.id);if(state.weakOnly){state.order=state.order.filter(id=>id!==c.id);if(state.index>=state.order.length)state.index=0;state.showAnswer=false;save();render()}else next()}
function shuffle(){ensureOrder();for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}state.index=0;state.showAnswer=false;save();render()}
function resetOrder(){state.order=sourceOrder(filteredCards()).map(c=>c.id);state.index=0;state.showAnswer=false;save();render()}

function aiAsk(c){const prompt=`中学生向け英単語を教えてください。\n学年：中${c.grade}\n英語：${c.en}\n日本語：${c.ja}\n意味、品詞、覚え方、短い例文と日本語訳、よくある使い方を分かりやすく説明してください。`;window.open('https://www.perplexity.ai/search?q='+encodeURIComponent(prompt),'_blank','noopener')}
function webSearch(c){window.open('https://www.google.com/search?q='+encodeURIComponent(`${c.en} 英語 意味 例文 発音`),'_blank','noopener')}
function renderStats(){const p=document.getElementById('statsPanel');if(!state.showStats){p.style.display='none';p.innerHTML='';return}const rows=baseCards().filter(c=>weakTimes(c.id)>0).sort((a,b)=>weakTimes(b.id)-weakTimes(a.id)||a.seq-b.seq).slice(0,20);p.style.display='block';if(!rows.length){p.innerHTML='<div class="empty">まだ「覚えていない」の集計がありません。</div>';return}p.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px"><b>📊 苦手ランキング（上位20問）</b>'+rows.map((c,i)=>`<div style="display:grid;grid-template-columns:32px 1fr auto;gap:8px;padding:7px 0;border-top:${i?'1px solid var(--line)':'0'}"><span>${i+1}</span><span>${esc(c.en)} → ${esc(c.ja)}</span><b style="color:var(--red)">${weakTimes(c.id)}回</b></div>`).join('')+'</div>'}
function render(){
  document.getElementById('grade').value=state.grade;document.getElementById('direction').value=state.direction;updateRangeOptions();document.getElementById('freqMin').value=String(state.freqMin||0);
  const w=document.getElementById('weakOnly');w.textContent='覚えていないだけ：'+(state.weakOnly?'ON':'OFF');w.classList.toggle('active',state.weakOnly);const hb=document.getElementById('hardOnly');hb.textContent='★ 苦手だけ：'+(state.hardOnly?'ON':'OFF');hb.classList.toggle('active',state.hardOnly);
  ensureOrder();const c=current();document.getElementById('progress').textContent=state.order.length?`${state.index+1} / ${state.order.length}`:'0 / 0';document.getElementById('weakCount').textContent='覚えていない '+state.weakIds.length;document.getElementById('learnedCount').textContent='覚えた '+state.learnedIds.length;document.getElementById('hardCount').textContent='苦手 '+state.hardIds.length;document.getElementById('freqCount').textContent='2回以上ミス '+baseCards().filter(x=>weakTimes(x.id)>=2).length;renderStats();
  const main=document.getElementById('main');if(!c){main.innerHTML='<div class="empty"><b>表示する問題がありません。</b><br>条件を変えるか、通常モードに戻してください。</div>';return}
  const dirLabel=c.dir==='ej'?'英語 → 日本語':'日本語 → 英語';
  let sourceMeta=c.rangeLabel;
  if(c.grade===1){
    const labelMap={
      u12a:'Unit1〜2①',u12b:'Unit1〜2②',u12c:'Unit1〜2③',u12d:'Unit1〜2④',
      u34a:'Unit3〜4①',u34b:'Unit3〜4②',u34c:'Unit3〜4③',u34d:'Unit3〜4④',u34e:'Unit3〜4⑤'
    };
    sourceMeta=(labelMap[state.range]||c.rangeLabel)+(c.sourceNo?` / No.${c.sourceNo}`:'');
  }
  main.innerHTML=`<button class="card" id="card" type="button"><div class="meta">中${c.grade}　${sourceMeta}　${dirLabel}</div><div class="side">${state.showAnswer?'答え':'問題'}</div><div class="${state.showAnswer?'answer':'question'}">${esc(state.showAnswer?c.a:c.q)}</div><div class="status" style="margin-top:14px;margin-bottom:0"><span class="chip">覚えていない累計 ${weakTimes(c.id)}回</span></div>${state.showAnswer&&c.note?`<div class="noteBox">※ ${esc(c.note)}</div>`:''}<div class="hint">必要なら先に「★ 苦手」を押し、そのあと「覚えていない」または「覚えた」を押すと次の問題へ進みます。<br>カードをタッチすると${state.showAnswer?'問題に戻ります':'答えが出ます'}</div></button><div class="lookup"><button id="speakBtn">🔊 発音</button>${state.showAnswer?'<button id="aiBtn">🤖 AIに聞く</button><button id="searchBtn">🔎 Web検索</button>':''}</div><div class="actions"><button class="hardbtn ${state.hardIds.includes(c.id)?'active':''}" id="hardBtn">${state.hardIds.includes(c.id)?'★ 苦手解除':'★ 苦手'}</button><button class="danger" id="weakBtn">覚えていない</button><button class="success" id="learnedBtn">覚えた</button></div><div class="nav"><button id="prevBtn">← 前へ</button><button id="flipBtn">${state.showAnswer?'問題を見る':'答えを見る'}</button><button id="nextBtn">次へ →</button><button id="removeWeakBtn">要復習から外す</button></div>`;
  document.getElementById('card').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};document.getElementById('flipBtn').onclick=()=>{state.showAnswer=!state.showAnswer;save();render()};document.getElementById('prevBtn').onclick=prev;document.getElementById('nextBtn').onclick=next;document.getElementById('weakBtn').onclick=markWeak;document.getElementById('learnedBtn').onclick=markLearned;document.getElementById('hardBtn').onclick=toggleHard;document.getElementById('removeWeakBtn').onclick=()=>{state.weakIds=state.weakIds.filter(id=>id!==c.id);save();render()};document.getElementById('speakBtn').onclick=()=>speakEnglish(c.en);if(state.showAnswer){document.getElementById('aiBtn').onclick=()=>aiAsk(c);document.getElementById('searchBtn').onclick=()=>webSearch(c)}
}
document.getElementById('userSelect').onchange=e=>switchUser(e.target.value);document.getElementById('addUser').onclick=addUser;document.getElementById('deleteUser').onclick=deleteUser;
document.getElementById('grade').onchange=e=>{state.grade=e.target.value;state.range='all';state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('direction').onchange=e=>{state.direction=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('rangeSel').onchange=e=>{state.range=e.target.value;state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('weakOnly').onclick=()=>{state.weakOnly=!state.weakOnly;if(state.weakOnly){state.hardOnly=false;state.freqMin=0;}state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('hardOnly').onclick=()=>{state.hardOnly=!state.hardOnly;if(state.hardOnly){state.weakOnly=false;state.freqMin=0;}state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('clearHard').onclick=()=>{if(confirm('苦手登録をすべて消しますか？')){state.hardIds=[];state.hardOnly=false;state.order=[];state.index=0;save();render()}};
document.getElementById('freqMin').onchange=e=>{state.freqMin=Number(e.target.value||0);if(state.freqMin>0){state.weakOnly=false;state.hardOnly=false;}state.order=[];state.index=0;state.showAnswer=false;save();render()};
document.getElementById('showStats').onclick=()=>{state.showStats=!state.showStats;save();render()};document.getElementById('shuffle').onclick=shuffle;document.getElementById('resetOrder').onclick=resetOrder;
document.getElementById('clearWeak').onclick=()=>{if(confirm('「覚えていない」の現在の登録をすべて消しますか？\n※累計ミス回数は残します。')){state.weakIds=[];state.order=[];state.index=0;save();render()}};
document.getElementById('clearAll').onclick=()=>{if(confirm('このユーザーの学習記録と苦手頻度をすべてリセットしますか？')){state=freshState();save();render()}};
loadUsers();loadState();renderUsers();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../service-worker.js'));
</script>
</body>
</html>
