<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563EB"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="学習カード"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><title>学習暗記カード</title><style>:root{--bg:#f4f6fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;--blue:#2563eb;--green:#16805c;--orange:#b86400;--shadow:0 12px 30px rgba(24,39,75,.09)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:920px;margin:0 auto;padding:22px 14px 40px}.hero{background:linear-gradient(135deg,#fff,#eef4ff);border:1px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);margin-bottom:18px}.heroTop{display:flex;align-items:center;gap:12px}.appIcon{width:58px;height:58px;border-radius:15px}h1{font-size:1.55rem;margin:0 0 5px}.hero p{margin:0;color:var(--muted);line-height:1.65}.installBox{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.installBtn{min-height:44px;border:1px solid #a9c8ff;border-radius:13px;background:#eaf2ff;padding:9px 13px;font-size:14px;font-weight:700;color:#174ea6}.tip{font-size:12px;color:var(--muted);align-self:center}.grid{display:grid;grid-template-columns:1fr;gap:13px}.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px 18px;box-shadow:var(--shadow)}.card:active{transform:translateY(1px)}.icon{font-size:2rem;margin-bottom:8px}.title{font-size:1.22rem;font-weight:800;margin-bottom:6px}.desc{font-size:.93rem;color:var(--muted);line-height:1.6}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#fafafa}.social .title{color:var(--blue)}.kanji .title{color:var(--orange)}.english .title{color:var(--green)}.note{font-size:12px;color:var(--muted);line-height:1.65;margin-top:17px;text-align:center}.loading{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:25px;text-align:center;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.card{min-height:250px}}</style></head><body><div class="wrap"><section class="hero"><div class="heroTop"><img class="appIcon" src="./icon-192.png" alt=""><div><h1>学習暗記カード</h1><p>学習する科目を選んでください。</p></div></div><div class="installBox"><button id="installBtn" class="installBtn" style="display:none">ホーム画面に追加</button><span id="installTip" class="tip">iPhoneはSafariの「共有」→「ホーム画面に追加」でも登録できます。</span></div></section><main id="subjectGrid" class="grid"><div class="loading">科目を読み込んでいます…</div></main><div class="note">各科目で「覚えた／覚えていない」、苦手頻度の集計、苦手問題だけの復習ができます。<br>新しい科目はフォルダを追加し、subjects.json に1件追加するだけでホーム画面に増やせます。</div></div><script>let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block';document.getElementById('installTip').textContent='タップするとアプリのようにホーム画面へ追加できます。'});document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';});window.addEventListener('appinstalled',()=>document.getElementById('installTip').textContent='ホーム画面に追加されました。');async function loadSubjects(){const g=document.getElementById('subjectGrid');try{const r=await fetch('./subjects.json',{cache:'no-store'});const a=await r.json();g.innerHTML=a.map(s=>`<a class="card ${s.className||''}" href="${s.href}"><div class="icon">${s.icon||'📘'}</div><div class="title">${s.title}</div><div class="desc">${s.description||''}</div><div class="tags">${(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></a>`).join('');}catch(e){g.innerHTML='<div class="loading">科目一覧を読み込めませんでした。ページを再読み込みしてください。</div>';}}loadSubjects();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script></body></html>
