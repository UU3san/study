<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>学習暗記カード</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;
  --blue:#2563eb;--green:#16805c;--orange:#b86400;--shadow:0 12px 30px rgba(24,39,75,.09)
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--text)
}
.wrap{max-width:880px;margin:0 auto;padding:26px 14px 40px}
.hero{
  background:linear-gradient(135deg,#ffffff,#eef4ff);
  border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);margin-bottom:18px
}
h1{font-size:1.65rem;margin:0 0 8px}
.hero p{margin:0;color:var(--muted);line-height:1.65}
.grid{display:grid;grid-template-columns:1fr;gap:13px}
.card{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:19px 18px;box-shadow:var(--shadow)
}
.card:active{transform:translateY(1px)}
.icon{font-size:2rem;margin-bottom:8px}
.title{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.desc{font-size:.93rem;color:var(--muted);line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#fafafa}
.social .title{color:var(--blue)}
.kanji .title{color:var(--orange)}
.english .title{color:var(--green)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:17px;text-align:center}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .card{min-height:255px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>📚 学習暗記カード</h1>
    <p>学習する科目を選んでください。<br>
    各科目で「覚えた／覚えていない」、苦手頻度の集計、苦手問題だけの復習ができます。</p>
  </section>

  <main class="grid">
    <a class="card social" href="./social/">
      <div class="icon">🌏</div>
      <div class="title">社会</div>
      <div class="desc">地理・歴史の一問一答。歴史は時代別に学習できます。</div>
      <div class="tags">
        <span class="tag">地理</span><span class="tag">歴史</span><span class="tag">苦手復習</span>
      </div>
    </a>

    <a class="card kanji" href="./kanji/">
      <div class="icon">🈶</div>
      <div class="title">高校入試 漢字</div>
      <div class="desc">読み取り・書き取りを第1回〜第15回まで学習できます。</div>
      <div class="tags">
        <span class="tag">読み</span><span class="tag">書き</span><span class="tag">苦手復習</span>
      </div>
    </a>

    <a class="card english" href="./english/">
      <div class="icon">🔤</div>
      <div class="title">英単語</div>
      <div class="desc">英語→日本語、日本語→英語の両方向で練習できます。</div>
      <div class="tags">
        <span class="tag">発音</span><span class="tag">両方向</span><span class="tag">苦手復習</span>
      </div>
    </a>
  </main>

  <div class="note">
    学習記録は科目ごと・ユーザーごとに、この端末のブラウザ内へ保存されます。
  </div>
</div>
</body>
</html>
